<!-- The main sidebar container -->
<nav class="sidebar">

  <div class="sidebar-header">
    <a routerLink="/dashboard" class="uba-brand">
      <img src="assets/images/eclectics-logo-nav.png?v=2" alt="Eclectics" class="eclectics-logo">
      <!-- <span class="uba-product">Digital Credit Decisioning</span> -->
      <!-- <span class="uba-mark">UBA</span> -->
    </a>
    <!-- Fraud Guard logo retained
    <a routerLink="dashboard" class="sidebar-brand nobleui-logo">
      <img src="assets/images/image1.png" alt="FinGuard AI" style="height: 70px; width: 130px;">
    </a>
    -->
    <div class="sidebar-toggler not-active" #sidebarToggler (click)="toggleSidebar($event)">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <div class="sidebar-body">
    <ul class="sidebar-nav metismenu" id="sidebar-menu" #sidebarMenu>
      <ng-container *ngFor="let group of menuGroups">
        <ng-container *ngIf="!group.label">
          <li class="nav-item" *ngFor="let item of group.items">
            <ng-container *ngTemplateOutlet="menuLink; context: { $implicit: item }"></ng-container>
          </li>
        </ng-container>

        <ng-container *ngIf="group.label">
          <li class="nav-section">
            <button type="button" class="nav-category" [class.open]="group.open" (click)="toggleGroup(group)" [attr.aria-expanded]="group.open">
              <span>{{ group.label }}</span>
              <svg class="nav-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
          </li>
          <li class="nav-item" *ngFor="let item of group.items" [hidden]="!group.open">
            <ng-container *ngTemplateOutlet="menuLink; context: { $implicit: item }"></ng-container>
          </li>
        </ng-container>
      </ng-container>

      <li class="nav-item" *ngIf="logoutItem">
        <ng-container *ngTemplateOutlet="menuLink; context: { $implicit: logoutItem }"></ng-container>
      </li>
    </ul>

    <ng-template #menuLink let-item>
      <ng-container *ngIf="item.subItems && item.subItems.length > 0; else singleLink">
        <a class="nav-link" href="javascript:void(0);">
          <i class="link-icon" [attr.data-feather]="item.icon" appFeatherIcon></i>
          <span class="link-title">{{ item.label }}</span>
        </a>
        <ul class="nav-second-level">
          <li *ngFor="let sub of item.subItems">
            <a class="nav-link" [routerLink]="sub.link" routerLinkActive="active">
              <i class="link-icon" [attr.data-feather]="sub.icon" appFeatherIcon></i>
              <span class="link-title">{{ sub.label }}</span>
            </a>
          </li>
        </ul>
      </ng-container>

      <ng-template #singleLink>
        <a *ngIf="!item.isLogout && !item.isSettings && !item.isHelpCenter" class="nav-link" [routerLink]="item.link" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: !!item.exact }">
          <i class="link-icon" [attr.data-feather]="item.icon" appFeatherIcon></i>
          <span class="link-title">{{ item.label }}</span>
          <span
            *ngIf="item.badge && item.badge.text > 0"
            class="badge rounded-pill ms-auto"
            [ngClass]="'bg-' + item.badge.variant">
            {{ item.badge.text }}
          </span>
        </a>
      </ng-template>

      <a *ngIf="item.isLogout" class="nav-link" href="#" (click)="onLogout($event)">
        <i class="link-icon" [attr.data-feather]="item.icon" appFeatherIcon></i>
        <span class="link-title">{{ item.label }}</span>
      </a>

      <a *ngIf="item.isSettings" class="nav-link" href="#" (click)="onSettingsClick($event)">
        <i class="link-icon" [attr.data-feather]="item.icon" appFeatherIcon></i>
        <span class="link-title">{{ item.label }}</span>
      </a>

      <a *ngIf="item.isHelpCenter" class="nav-link" href="#" (click)="onHelpCenterClick($event)">
        <i class="link-icon" [attr.data-feather]="item.icon" appFeatherIcon></i>
        <span class="link-title">{{ item.label }}</span>
      </a>
    </ng-template>
  </div>

  <button type="button" class="sidebar-ai" (click)="toggleAi($event)" title="Ask about scores, alerts, reports, and policy">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3V12a8 8 0 1 1 18 0z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/></svg>
    <span>Ask AI</span>
  </button>

  <div class="sidebar-status">
    <span class="status-dot"></span>
    <div>
      <strong>System operational</strong>
      <small>Demo environment</small>
    </div>
  </div>
  <div class="sidebar-version">Eclectics · v0.1.0</div>

  <!-- Previous user footer
  <div class="sidebar-user-footer">
    <div class="user-avatar">{{ userInitials }}</div>
    <div class="user-details">
      <span class="user-name">{{ userDisplayName }}</span>
      <span class="user-title">{{ userTitle }}</span>
    </div>
  </div>
  -->

</nav>

<app-settings-modal *ngIf="isSettingsModalVisible" (close)="closeSettingsModal()"></app-settings-modal>

<aside class="ai-panel" *ngIf="aiOpen" aria-label="Digital Credit assistant">
  <header>
    <strong>Digital Credit assistant</strong>
    <button type="button" (click)="aiOpen = false">Close</button>
  </header>
  <div class="ai-log">
    <p *ngFor="let message of aiMessages" [class.you]="message.from === 'you'">{{ message.text }}</p>
  </div>
  <div class="ai-suggest">
    <button type="button" (click)="askAi('How does the credit score move?')">Score movement</button>
    <button type="button" (click)="askAi('How do I work an alert?')">Work an alert</button>
    <button type="button" (click)="askAi('Where are reports and the audit trail?')">Reports and audit</button>
  </div>
  <form (submit)="askAi(aiBox.value); aiBox.value = ''; $event.preventDefault()">
    <input #aiBox type="text" placeholder="Ask about a case or a score" />
    <button type="submit">Send</button>
  </form>
</aside>
