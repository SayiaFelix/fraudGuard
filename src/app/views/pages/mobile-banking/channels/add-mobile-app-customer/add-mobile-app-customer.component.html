<div>
  <div class="modal-header">
    <h5 class="modal-title" id="exampleModalLabel">{{title}}</h5>
    <button (click)="closeModal()" aria-label="Close" class="btn-close" type="button"></button>
  </div>
  <div [formGroup]="form" class="modal-body">
    <div class="row g-3">
      <div class="col-md-12">
        <label class="form-label">Select Search Parameter</label>
        <ng-select [(ngModel)]="selectedSimpleItem"
                   [items]="['Account Number', 'Name', 'ID Number']"
                   [searchable]="false">
        </ng-select>
      </div>
      <div class="col-md-12">
        <label class="form-label">Key in Search parameter</label>
        <ng-select [(ngModel)]="selectedSearchPersonId"
                   [items]="people"
                   bindLabel="name"
                   bindValue="id"
                   placeholder="type to search">
        </ng-select>
        <p class="mt-2 text-muted">Selected item: <span class="fw-bolder">{{selectedSearchPersonId}}</span></p>
      </div>

    </div>
  </div>
  <div class="modal-footer">
    <button (click)="closeModal()" class="btn btn-secondary" type="button">Close</button>
    <button (click)="closeModal()" class="btn btn-primary" type="button">Save changes</button>
  </div>
</div>
