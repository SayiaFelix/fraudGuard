  <div>
    <div class="modal-header">
      <h5 class="modal-title" id="exampleModalLabel">{{title}}</h5>
      <button (click)="closeModal()" aria-label="Close" class="btn-close" type="button"></button>
    </div>
    <div class="modal-body" [formGroup]="form">
      <div class="row g-3">
        <div class="col-md-12">
            <label class="form-label">Channel Name</label>
            <input class="form-control" formControlName="name" type="text" />
            <small
              *ngIf="
              form.get('name')?.touched &&
              form.get('name')?.hasError('required')
            "
              class="text-danger"
            >Required Field</small>
        </div>
        <div class="col-md-12">
          <label class="form-label">Channel Code</label>
          <input class="form-control" formControlName="code" type="text" />
          <small
            *ngIf="
              form.get('code')?.touched &&
              form.get('code')?.hasError('required')
            "
            class="text-danger"
          >Required Field</small>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button (click)="closeModal()" class="btn btn-secondary" type="button">Close</button>
      <button (click)="closeModal()" class="btn btn-primary" type="button">Save changes</button>
    </div>
  </div>
