<div
  class="d-flex justify-content-between align-items-center flex-wrap grid-margin"
>
  <div>
    <h4 class="mb-3 mb-md-0">All Product Categories</h4>
  </div>

  <div ngbDropdown>
    <button class="btn btn-primary btn-xs" id="dropdownBasic1" ngbDropdownToggle>Select View</button>
    <div ngbDropdownMenu aria-labelledby="dropdownBasic1">
      <button ngbDropdownItem routerLink="/mobile-banking/products/list-categories-as-cards">Card View</button>
      <button ngbDropdownItem routerLink="/mobile-banking/products/list-requests">Table View</button>
    </div>
  </div>

  <app-table-header
    [allColumns]="allColumns"
    [rows]="rows"
    [title]="title"
    [showAddButton]="true"
    (changeColumnsEvent)="updateColumns($event)"
    (openAddModalEvent)="openAddProductModal()"
  ></app-table-header>

</div>

<div class="row text-center m-auto">
  <div class="col-md-12 stretch-card">

    <div class="col-md-12 grid-margin stretch-card">
      <div class="card">
        <div class="card-body">
          <owl-carousel-o [options]="autoPlayExampleOptions">
            <ng-template carouselSlide *ngFor="let category of fetchedCategories" [id]="category?.id">
              <div class="m-3 p-3 ">
                <div class="card d-flex justify-content-center">
                  <!-- <img class="card-img-top" [src]="domSanitizer.bypassSecurityTrustResourceUrl(slide.categoryUrl)" [alt]="slide.alt"> -->
                  <!-- <img class="card-img-top text-center m-auto" [src]="domSanitizer.bypassSecurityTrustResourceUrl(category?.categoryUrl?.trim())"> -->
                  <img class="card-img-top text-center m-auto" [src]="category.categoryUrl.trim()" [alt]="category.alt" preload>

                  <!-- <img [src]="slide.categoryUrl | SafeUrl"> -->
                  <!-- <img src="..." class="card-img-top" alt="..."> -->
                  <div class="card-body">
                    <h5 class="card-title">{{category?.name}}</h5>
                    <p class="card-text">{{category?.description}}</p>

                    <div class="d-grid gap-2 d-md-block">
                      <a [routerLink]="'/mobile-banking/products/list-products-as-cards/' + category.id"
                         class="btn btn-warning btn-sm" style="color:white"
                         *ngIf="category?.children?.length === 0">
                        View Products
                      </a>
                      <a
                        (click)="viewSubProducts(category)"
                        class="btn btn-warning btn-sm" style="color:white"
                        *ngIf="category?.children?.length > 0">
                        View Sub-Categories
                      </a>
                      <a (click)="editProduct(category)" class="btn btn-primary btn-sm">Edit</a>
                      <a (click)="openDeleteModal(category)" class="btn btn-danger btn-sm"> Delete</a>
                    </div>

                  </div>
                </div>

              </div>

            </ng-template>
          </owl-carousel-o>
        </div>
      </div>
    </div>

  </div>
</div>
