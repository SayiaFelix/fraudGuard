<div
  class="d-flex justify-content-between align-items-center flex-wrap grid-margin"
>
  <div>
    <h4 class="mb-3 mb-md-0" style="font-family: Mulish; font-style: normal; font-weight: 700; font-size: 21px; line-height: 30px;">Requested Accreditations</h4>
  </div>
  <div class="d-flex justify-content-between">
    <app-table-header
    [allColumns]="allColumns"
    [rows]="rows"
    [title]="title"
    [showAddButton]="true"
    (openAddModalEvent)="openAddRequestModal()"
    (changeColumnsEvent)="updateColumns($event)">
  </app-table-header>
  <!-- <button (click)="openAddRequestModal()" class="btn btn-sm btn-primary pull-right mr-3"><span class="mr-1"></span>Make Request </button> -->
  </div>
</div>


<div class="row">
  <div class="col-md-12 stretch-card">
    <div class="card" *ngIf="rows.length > 0">
        <app-custom-ngx-table
          [columns]="columns"
          [rows]="rows"
          [actions]="actions"
          [hasViewAndEdit]="true"
          [loadingIndicator]="loading"
          (outputEvent)="triggerEvent($event)"
        ></app-custom-ngx-table>
    </div>
  </div>
</div>
