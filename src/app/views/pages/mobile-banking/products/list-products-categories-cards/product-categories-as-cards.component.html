<div class="container-fluid py-4">

  <!-- Header -->
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-2 mb-md-0 d-flex align-items-center">
       MIS Reports
    </h2>
    <div class="d-flex gap-2 flex-wrap">
      <!-- Export Dropdown -->
      <div class="dropdown">
        <button 
          class="btn btn-outline-secondary btn-sm dropdown-toggle" 
          type="button" 
          id="exportDropdown" 
          data-bs-toggle="dropdown" 
          aria-expanded="false">
          <i class="fas fa-file-export me-1"></i> Export
        </button>
        <ul class="dropdown-menu" aria-labelledby="exportDropdown">
          <li>
            <a class="dropdown-item d-flex align-items-center" 
                [class.disabled]="filteredReports.length === 0"
                (click)="filteredReports.length > 0 && exportAsPDF()">
                <i class="fas fa-file-pdf me-2 text-danger"></i> Export PDF
              </a>
          </li>
          <li>
            <a class="dropdown-item d-flex align-items-center" (click)="exportAsExcel()">
              <i class="fas fa-file-excel me-2 text-success"></i> Export Excel
            </a>
          </li>
        </ul>
      </div>

      <!-- Auto Report -->
      <button class="btn btn-primary btn-sm" (click)="createAutoReport()">
        <i class="fas fa-file-alt me-1"></i> Create Auto Report
      </button>
    </div>
  </div>

  <!-- Upload Card -->
  <div class="row g-3 mb-4">
    <div class="col-md-6 col-lg-4">
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <h5 class="fw-bold mb-3 d-flex align-items-center">
            <i class="fas fa-upload me-2 text-success"></i> Upload Report
          </h5>
          <div class="mb-2">
            <input id="misFile" class="form-control" type="file" (change)="handleFileInput($event)">
          </div>
          <div class="mb-3">
            <input class="form-control" placeholder="Report title" [(ngModel)]="newTitle">
          </div>
          <button class="btn btn-success w-100" (click)="uploadReportMetadata()">
            <i class="fas fa-cloud-upload-alt me-1"></i> Upload
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Loading Spinner -->
  <div *ngIf="isLoading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Report List Table -->
  <div class="card shadow-sm border-0" *ngIf="!isLoading">
    <div class="card-header bg-white">
      <!-- Title Row -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0 fw-bold">
          Report List 
         <span class="badge bg-secondary ms-2">{{ filteredReports.length }}</span>
        </h3>
      </div>

      <!-- Filter Row -->
      <div class="row g-2 align-items-end">
            
        <div class="col-md-4">
          <label class="form-label small mb-1">Title</label>
          <input type="text" class="form-control form-control-sm" placeholder="Search by title" [(ngModel)]="filterTitle" (ngModelChange)="applyFilter()">
        </div>
        <div class="col-md-3">
          <label class="form-label small mb-1">Type</label>
          <select class="form-select form-select-sm" [(ngModel)]="filterType" (change)="applyFilter()">
            <option value="">All Types</option>
            <option value="auto-generated">Auto-Generated</option>
            <option value="uploaded">Uploaded</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label small mb-1">Created After</label>
          <input type="date" class="form-control form-control-sm" [(ngModel)]="filterDate" (change)="applyFilter()">
        </div>
        <div class="col-md-2">
          <button class="btn btn-secondary btn-sm w-100" (click)="clearFilters()">
            <i class="fas fa-times me-1"></i> Clear Filters
          </button>
        </div>
      </div>
     </div>
     
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover table-striped align-middle mb-0">
          <thead class="table-light text-uppercase small">
            <tr>
              <th scope="col">Title</th>
              <th scope="col">Type</th>
              <th scope="col">Created</th>
              <th scope="col" class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let r of filteredReports">
              <td class="fw-medium">{{ r.title }}</td>
              <td>
                <span 
                  class="badge"
                  [ngClass]="{
                    'bg-primary': r.type === 'auto-generated',
                    'bg-success': r.type === 'uploaded'
                  }">
                  {{ r.type | titlecase }}
                </span>
              </td>
              <td>{{ r.createdAt | date:'medium' }}</td>
              <td class="text-end">
                <button class="btn btn-sm btn-outline-success me-1" (click)="downloadReport(r)" title="Download Report">
                  <i class="fas fa-download"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger" (click)="deleteReport(r)" title="Delete Report">
                  <i class="fas fa-trash-alt"></i>
                </button>
              </td>
            </tr>
            <tr *ngIf="filteredReports.length === 0">
              <td colspan="4" class="text-center text-muted py-3">
                No reports available
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>
