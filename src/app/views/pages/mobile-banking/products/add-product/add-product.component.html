  <div>
    <div class="modal-header">
      <h5 class="modal-title" id="exampleModalLabel">{{title}}</h5>
      <button (click)="closeModal()" aria-label="Close" class="btn-close" type="button"></button>
    </div>
    <div class="modal-body" [formGroup]="form">
      <div class="row">
        <div class="col-sm-12">
          <div class="mb-3">
            <label class="form-label fw-bold">Category Name</label>
            <input class="form-control" formControlName="name" type="text" />
            <small
              *ngIf="
              form.get('name')?.touched &&
              form.get('name')?.hasError('required')
            "
              class="text-danger"
            >Required Field</small
            >
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Parent Category</label>
            <select
              class="form-select"
              id="parentId"
              name="parentId"
              formControlName="parentId"
            >
              <option [value]="''">_</option>
              <option disabled hidden selected>Select Parent Category</option>
              <option
                *ngFor="let parentCategory of allProductCategories"
                [value]="parentCategory.id">
                {{parentCategory.name}}</option>
            </select>
          </div>
        </div>
        <div class="col-sm-12">
          <div class="mb-3">
            <label class="text-gray fw-bold">Description</label>
            <textarea
              class="form-control"
              formControlName="description"
              type="text"
            ></textarea>
            <small
              *ngIf="
              form.get('description')?.touched &&
              form.get('description')?.hasError('required')
            "
              class="text-danger"
            >Required Field</small
            >
          </div>
        </div>

        <div class="col-sm-12">
          <div class="form-group">
            <label class="text-gray fw-bold">Category Image</label>
            <input #fileUpload (change)="onFileChange($event)"
                   accept="image/*"
                   class="form-control"
                   id="file"
                   type="file"
            />
          </div>
        </div>
        <div class="col-sm-12">
          <!-- <div class="mb-3">
            <label class="text-gray">Product Image</label>
            <input
              #fileUpload
              (change)="onFileChange($event)"
              accept="image/*"
              class="form-control"
              formControlName="image"
              id="file"
              type="file"
            />
          </div> -->
        </div>

        <p *ngIf="isLoading"><ngb-progressbar type="primary" [value]="95" [striped]="true" [animated]="true"></ngb-progressbar></p>

      </div>
    </div>
    <div class="modal-footer">
      <button (click)="closeModal()" class="btn btn-secondary" type="button">Close</button>
      <button (click)="submitData()" *ngIf="!this.formData" class="btn btn-primary" type="button" [disabled]="!form.valid || isLoading">Create Category</button>
      <button (click)="submitData()" *ngIf="this.formData" class="btn btn-primary" type="button" [disabled]="!form.valid || isLoading">Save changes</button>
    </div>
  </div>
