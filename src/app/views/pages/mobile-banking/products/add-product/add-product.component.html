  <div>
    <div class="modal-header">
      <h5 class="modal-title" id="exampleModalLabel">{{title}}</h5>
      <button (click)="closeModal()" aria-label="Close" class="btn-close" type="button"></button>
    </div>
    <div class="modal-body" [formGroup]="form">
      <div class="row">
        <div class="col-sm-12">
          <div class="mb-3">
            <label class="form-label">Category Name</label>
            <input class="form-control" formControlName="name" type="text" />
            <small
              *ngIf="
              form.get('name')?.touched &&
              form.get('name')?.hasError('required')
            "
              class="text-danger"
            >Required Field</small
            >
          </div>

          <div class="mb-3">
            <label class="form-label">Parent Category</label>
            <select
              class="form-select"
              id="profile"
              name="profile"
            >
              <option>_</option>
              <option>Loans</option>
              <option>Investments</option>
            </select>
          </div>
        </div>
        <div class="col-sm-12">
          <div class="mb-3">
            <label class="text-gray">Description</label>
            <textarea
              class="form-control"
              formControlName="description"
              type="text"
            ></textarea>
            <small
              *ngIf="
              form.get('description')?.touched &&
              form.get('description')?.hasError('required')
            "
              class="text-danger"
            >Required Field</small
            >
          </div>
        </div>
        <div class="col-sm-12">
          <!-- <div class="mb-3">
            <label class="text-gray">Product Image</label>
            <input
              #fileUpload
              (change)="onFileChange($event)"
              accept="image/*"
              class="form-control"
              formControlName="image"
              id="file"
              type="file"
            />
          </div> -->
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button (click)="closeModal()" class="btn btn-secondary" type="button">Close</button>
      <button (click)="submitData()" class="btn btn-primary" type="button">Save changes</button>
    </div>
  </div>
