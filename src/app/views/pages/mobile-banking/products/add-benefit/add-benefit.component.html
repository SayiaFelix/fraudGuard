<div>
    <div class="modal-header">
      <h5 class="modal-title" id="exampleModalLabel">{{title}}</h5>
      <button (click)="closeModal()" aria-label="Close" class="btn-close" type="button"></button>
    </div>
    <div class="modal-body" [formGroup]="form">
      <div class="row">
        <div class="col-sm-12">
          <div class="mb-3">
            <label class="form-label">Benefit</label>
            <input class="form-control" formControlName="benefit" type="text" />
            <small
              *ngIf="
              form.get('benefit')?.touched &&
              form.get('benefit')?.hasError('required')"
              class="text-danger"
            >Required Field</small
            >
          </div>
        </div>
        <div class="col-sm-12">
          <div class="mb-3">
            <label class="form-label">Benefit Code</label>
            <input class="form-control" formControlName="benefitCode" type="text" />
            <small
              *ngIf="
              form.get('benefitCode')?.touched &&
              form.get('benefitCode')?.hasError('required')"
              class="text-danger"
            >Required Field</small>
          </div>
        </div>
        <div class="col-sm-12">
          <div class="mb-3">
            <label class="form-label">Benefit Description</label>
            <input class="form-control" formControlName="description" type="text" />
            <small
              *ngIf="
              form.get('description')?.touched &&
              form.get('description')?.hasError('required')"
              class="text-danger"
            >Required Field</small>
          </div>
          <p *ngIf="isLoading"><ngb-progressbar type="primary" [value]="95" [striped]="true" [animated]="true"></ngb-progressbar></p>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button (click)="closeModal()" class="btn btn-secondary" type="button">Close</button>
      <button (click)="submitData()" class="btn btn-primary" type="button" *ngIf="this.formData && !this.formData.id">Add Benefit</button>
      <button (click)="submitData()" class="btn btn-primary" type="button" *ngIf="this.formData && this.formData.id">Edit Benefit</button>
      <!-- [disabled]="!form.valid || isLoading" -->
    </div>
  </div>
