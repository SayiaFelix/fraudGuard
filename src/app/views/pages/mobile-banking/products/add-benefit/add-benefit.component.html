<div class="d-flex justify-content-between align-items-center flex-wrap grid-margin p-2">
  <div>
    <h4 class="mb-3 mb-md-0"
      style="color: var(--dark-purple, #1E0F2E);font-family: Muli;font-size: 20px;font-style: normal;font-weight: 700;line-height: 26px; ">
      My Request | New Pre- Qualification Assessment Checklist</h4>
  </div>
</div>

<div class="card" style="position: relative; margin-top:-1%; margin-bottom: 70%;">
  <div class="row">
    <div class="col-md-12 col-lg-12 col-xl-12 col-sm-12">
      <div class="box-shadow">
        <img class="card-img-top img-fluid" style="max-width:100% ; height: 250px ; border-radius: 16px;"
          src="assets/images/requests.png" />
      </div>
    </div>
  </div>

  <div
    style="position:absolute; padding: 16px 24px; border-radius: 16px; background: #FFF; width: 90%; margin-left: 5%; margin-top: 21%;">
    <div>
      <h1
        style="color: var(--grape-tra, #6D36A8);font-family: Mulish;font-size: 20px;font-style: normal;font-weight: 700;line-height: 24px;">
        New Pre- Qualification Assessment Checklist
      </h1>

      <form [formGroup]="form">
        <div class="mt-3">
          <h3 class="form-label quiz">Class Enterprise</h3>
          <select class="form-select" id="class_name" (change)="onClassChange($event)" name="class_name"
            formControlName="class_name">
            <option *ngFor="let classItem of ClassData?.classes" [value]="classItem.classId">
              {{ classItem.className }}
            </option>
          </select>
        </div>
        <div class="mt-4">
          <h3 class="form-label quiz">Enterprise Category</h3>
          <select class="form-select" id="subClass" name="subClass" formControlName="subClassName">
            <option *ngFor="let data of SubClassData" [value]="data.subClassName">
              {{ data.subClassName }}
            </option>
          </select>
        </div>
        <div class="mt-4">
          <h3 class="form-label quiz">Type of Request</h3>
          <select class="form-select" id="requestType" name="requestType" formControlName="request_type">
            <option value="ACCREDITATION">ACCREDITATION</option>
            <option value="CLASSIFICATION">CLASSIFICATION</option>
          </select>
        </div>

        <div *ngFor="let question of questionnaireData?.questions; let i = index" class="mt-4">
          <h3 class="quiz">{{ question.question }}</h3>
          <ng-container *ngFor="let option of question.options; let j = index">
            <div class="d-flex justify-content-between">
              <p class="sub-quiz">{{ option.optionText }}</p>
              <div class="d-flex justify-content-between">
                <div class="form-group custom-control" style="margin-right: 18px;">
                  <input
                    type="checkbox"
                    class="custom-control-input quiz-check"
                    [id]="'q' + i + 's' + j + 'Yes'"
                    [name]="'q' + i + 's' + j"
                    [checked]="option.selected === 'Yes'"
                    (change)="toggleCheckbox(i, j, 'Yes')"
                  />
                  <label [for]="'q' + i + 's' + j + 'Yes'" class="custom-control-label quiz-check">Yes</label>
                </div>
                <div class="form-group custom-control">
                  <input
                    type="checkbox"
                    class="custom-control-input quiz-check"
                    [id]="'q' + i + 's' + j + 'No'"
                    [name]="'q' + i + 's' + j"
                    [checked]="option.selected === 'No'"
                    (change)="toggleCheckbox(i, j, 'No')"
                  />
                  <label [for]="'q' + i + 's' + j + 'No'" class="custom-control-label quiz-check">No</label>
                </div>
              </div>
            </div>
          </ng-container>
          <div class="form-group mt-2">
            <textarea [id]="'comment' + i" cols="13" rows="2" class="form-control validation-field text"></textarea>
          </div>
        </div>
