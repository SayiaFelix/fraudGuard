<nav class="page-breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a routerLink="/tra-client/requests/all">All Requests</a></li>
    <!-- <li class="breadcrumb-item"><a [routerLink]="'/mobile-banking/products/list-products-as-cards/'+ categoryId">View Products</a></li> -->
    <li class="breadcrumb-item active" aria-current="page">View Request</li>
  </ol>
</nav>
<div class="container mt-4">
  <div class="row g-4">
    <div class="col-12 col-md-6 col-lg-6 col-sm-12" *ngFor="let dashboard of paginatedDashboards">
      <div class="dashboard-item p-3" style="height: 400px;"> <!-- Fixed parent height -->
        <tableau-viz
          id="{{dashboard.id}}"
          [attr.src]="dashboard.src"  
          class="w-100 h-100" 
          hide-tabs
          toolbar="bottom">
        </tableau-viz>
      </div>
    </div>
  </div>
  <div class="pagination mt-3 d-flex justify-content-end">
    <button class="btn btn-primary me-2" (click)="prevPage()" [disabled]="currentPage === 0">
      Previous
    </button>
    <button class="btn btn-success" (click)="nextPage()" [disabled]="(currentPage + 1) * itemsPerPage >= dashboards.length">
      Next
    </button>
  </div>
</div>

<div>
  <footer class="footer mt-3 d-flex flex-column flex-md-row align-items-center justify-content-between px-4 border-top small">

  </footer>
</div>
