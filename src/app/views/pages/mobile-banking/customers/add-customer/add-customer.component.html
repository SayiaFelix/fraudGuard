<div class="row">
  <!-- LEFT SIDE: Form Panel (col-6) -->
  <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 mb-3">
    <div class="p-4 border rounded bg-white">
      <div [formGroup]="form">
            <!-- Image Upload Section (inline layout) -->
        <div class="d-flex align-items-center gap-3 mb-4">
          <!-- Icon/Image -->
          <label style="width: 64;height: 64;opacity: 1;gap: 10px;border-radius: 32px;border-width: 1px;border-style: dashed;dashes: 4, 4;
padding: 10px; background: #F8F8F8;

" for="file-input" style="cursor: pointer;">
            <img src="./assets/images/T.png" alt="Upload Image" class="upload-icon" style="width: 15px; height: 20px;">
          </label>

          <!-- Upload Button -->
          <button type="button" class="btn btn-primary btn-sm" (click)="uploadImageClick()">
            Upload
            <input id="file-input" type="file" accept="image/*" (change)="onFileSelected()" hidden />
          </button>

          <!-- Remove Button -->
          <button type="button" class="btn btn-sm"  style="border: 1px solid #D8D8DA; color: #202020;
;" (click)="removeImage()">
            Remove
          </button>
          <!-- <span style="color: #99A1AF;
">PNG or JPEG up to 10 MB</span> -->
        </div>
    

        <!-- Name Field -->
        <div class="mb-4">
          <label class="form-label fw-bold">Name</label>
          <input placeholder="Enter the Chatbot Name"  class="form-control" formControlName="name" type="text" />
          <small *ngIf="form.get('name')?.touched && form.get('name')?.hasError('required')" class="text-danger">
            Required Field
          </small>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Description</label>
          <input placeholder="Enter Chatbot Description" class="form-control" formControlName="description" type="text" />
        </div>

     <!-- Languages Input with Tags -->
        <div class="mb-3">
          <label class="form-label fw-bold">Languages</label>
          <div class="form-control d-flex flex-wrap align-items-center" style="min-height: 48px;">
            
            <!-- Tags inside the input -->
          <span *ngFor="let lang of language" class="badge bg-primary me-2 mb-1 rounded-pill">
              {{ lang }}
              <i class="mdi mdi-close-circle ms-1" style="cursor: pointer;" (click)="removeLanguage(lang)"></i>
          </span>

    <!-- Dropdown at the end of the input box -->
          <select
              class="form-select border-0 shadow-none p-0 m-0 ms-auto"
              style=" width: auto; min-width: 140px; background-color: #f8f9fa; font-size: 14px; border-radius: 4px; padding: 4px 8px;"
              (change)="addLanguage($event)">
              <option value="" disabled selected>Select language</option>
              <option
                *ngFor="let lang of availableLanguages"
                [value]="lang"
                [disabled]="language.includes(lang)">
                {{ lang }}
              </option>
        </select>

          
  </div>
        </div>

  
   <!-- Default Language Field -->
      <div class="mb-3">
        <label class="form-label fw-bold">Default Language</label>
        <input class="form-control" [value]="defaultLanguage" readonly />
      </div>



        <!-- Footer Buttons -->
        <div class="d-flex justify-content-end gap-2 mt-4">
          <button (click)="closeModal()" type="button" class="btn btn-outline-secondary btn-sm px-4">
            Delete
          </button>
          <button (click)="sendBot()" [disabled]="!form.valid" type="button" class="btn btn-primary btn-sm px-4">
            Save
          </button>
        </div>

      </div>
    </div>
  </div>
  <div style="background: #F8F8F8;" class="col-xl-6 col-lg-6 col-md-6 col-sm-12">
  <div class="p-4 border rounded bg-white">
    <h3 class="mb-3" style="font-family: Roboto; font-weight: 500; font-size: 20px; color: #364153;">
      Recent Agent List
    </h3>

    <table *ngIf="agentList?.length" class="table table-striped text-center">
      <thead class="table-light">
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Created At</th>
          <th>Enabled</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let agent of agentList">
          <td>{{ agent.id }}</td>
          <td style="color: #364153;">{{ agent.name }}</td>
          
          <td>{{ agent.created_at | date:'medium' }}</td>
          <td>
            <span 
              class="badge" 
              [ngClass]="{
                'bg-success': agent.is_active === true,
                'bg-danger': agent.is_active === false
              }">
              {{ agent.is_active ? 'Active' : 'Inactive' }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>

    <p *ngIf="!agentList?.length" class="text-muted">No bot has been created yet.</p>
  </div>
</div>



</div>
