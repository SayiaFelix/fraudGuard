
<div style="background-color: #f8f9fa;" class="p-2">

  <div class="card border-0 shadow-sm mb-2">
    <div class="card-body">
      <div [formGroup]="form">
        <div class="d-flex flex-wrap flex-lg-nowrap gap-4">

            <!-- Image Uploader -->
            <div class="text-center" style="width: 110px; flex-shrink: 0;  margin-top: 50px;">
              <label for="file-input"
                class="d-flex align-items-center justify-content-center mb-2"
                style="cursor: pointer; width: 100px; height: 100px; border: 2px dashed #e0e0e0; border-radius: 8px; background-color: #f8f9fa; margin: auto;">
                <img src="./assets/images/T.png" alt="Upload Icon" style="width: 20px; height: 26px; opacity: 0.5;">
              </label>

              <div class="d-flex justify-content-center gap-2 mb-2">
                <button type="button" class="btn btn-primary btn-sm" (click)="uploadImageClick()">Upload</button>
                <input id="file-input" type="file" accept="image/*" (change)="onFileSelected()" hidden />
                <button type="button" class="btn btn-light btn-sm border" (click)="removeImage()">Remove</button>
              </div>

              <small class="text-muted">PNG or JPEG up to 10MB</small>
            </div>
            <div class="border-start mx-3" style="height: auto; min-height: 100px;"></div>

          <!-- Form Fields -->
          <div class="flex-grow-1">

            <!-- Name -->
            <div class="mb-3">
              <label class="form-label fw-bold">Name</label>
              <input placeholder="Enter the Chatbot Name" class="form-control" formControlName="name" type="text" />
              <small *ngIf="form.get('name')?.touched && form.get('name')?.hasError('required')" class="text-danger">Required Field</small>
            </div>

            <!-- Description -->
            <div class="mb-3">
              <label class="form-label fw-bold">Description</label>
              <input placeholder="Enter Chatbot Description" class="form-control" formControlName="description" type="text" />
            </div>

            <!-- Language -->
            <div class="mb-3">
              <label class="form-label fw-bold">Language</label>
              <div class="form-control d-flex align-items-center flex-wrap" style="min-height: 38px; gap: 6px;">
                <span *ngFor="let lang of language" class="badge rounded-pill" style="background-color: #e0e7ff; color: #3730a3; font-weight: 500; padding: 6px 10px; font-size: 0.85em;">
                  {{ lang }}
                  <i class="mdi mdi-close ms-1" style="cursor: pointer; vertical-align: middle;" (click)="removeLanguage(lang)"></i>
                </span>

                <select class="form-select border-0 shadow-none p-0 m-0 ms-auto" style="width: auto; min-width: 140px; background-color: transparent; font-size: 14px;" (change)="addLanguage($event)">
                  <option value="" disabled selected>Select language</option>
                  <option *ngFor="let lang of availableLanguages" [value]="lang" [disabled]="language.includes(lang)">
                    {{ lang }}
                  </option>
                </select>
              </div>
            </div>

            <!-- Default Language -->
            <div class="mb-3">
              <label class="form-label fw-bold">Default Language</label>
              <input class="form-control" [value]="defaultLanguage" readonly />
            </div>

          </div>
          </div>

       

        <!-- Footer Buttons-->
        <div class="d-flex justify-content-end gap-2 mt-4 border-top pt-3">
          <button (click)="closeModal()" type="button" class="btn btn-outline-secondary btn-sm px-4">
            Delete
          </button>
          <button (click)="sendBot()" [disabled]="!form.valid" type="button" class="btn btn-primary btn-sm px-4">
            Save
          </button>
        </div>
      </div>
    </div>
  </div>
