<div
  class="d-flex justify-content-between align-items-center flex-wrap grid-margin"
>

  </div>
</div>


<div class="row">
  <div class="col-md-6 stretch-card">

      <div class="d-grid my-3 mx-3">

<!--           [download]="specificVisitTitle"-->
<!--           style="text-decoration: none;"-->
<!--           target="_blank">-->
