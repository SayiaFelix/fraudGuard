<div class="container-fluid">
  <h3 class="mb-2"> #{{auditId}} <span class="text-dark fw-bold">{{ auditTitle }}</span></h3>

    <div class="d-flex justify-content-between mb-3 flex-wrap">
      <!-- Search -->
      <div class="input-group w-25 me-2 mb-2">
        <span class="input-group-text"><i class="fas fa-search"></i></span>
        <input type="text" class="form-control" placeholder="Search observations..."
              [(ngModel)]="searchTerm" (ngModelChange)="applyFilters()">
      </div>

      <select class="form-select w-auto me-2 mb-2"
              [(ngModel)]="severityFilter" (change)="applyFilters()">
        <option value="">All Severities</option>
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
      </select>

      <select class="form-select w-auto me-2 mb-2"
              [(ngModel)]="statusFilter" (change)="applyFilters()">
        <option value="">All Statuses</option>
        <option value="Open">Open</option>
        <option value="In Progress">In Progress</option>
        <option value="Closed">Closed</option>
      </select>

      <!-- Reset Filters -->
      <button class="btn btn-outline-secondary btn-sm mb-2" (click)="resetFilters()">
        <i class="fas fa-undo"></i> Reset
      </button>

      <!-- Add Button -->
      <button class="btn btn-sm btn-primary save-btn mb-2" (click)="openAddObservationModal()">
        <i class="fas fa-plus"></i> Add Observation
      </button>
  </div>

  <div *ngIf="isLoading" class="text-center my-5">
    <div class="spinner-border text-primary"></div>
  </div>

  <div *ngIf="!isLoading && filteredObservations.length === 0" class="alert alert-info">
    No observations found for this audit.
  </div>

  <div *ngIf="!isLoading && filteredObservations.length > 0" class="table-responsive">
    <table class="table table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>Description</th>
          <th>Severity</th>
          <th>Status</th>
          <th>Recommendation</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let obs of filteredObservations">
          <td>{{ obs.description }}</td>
          <td>
            <span class="badge"
              [ngClass]="{
                'bg-danger': obs.severity === 'High',
                'bg-warning text-dark': obs.severity === 'Medium',
                'bg-success': obs.severity === 'Low'
              }">{{ obs.severity }}</span>
          </td>
       
            <td>
              <span [ngClass]="{
                'text-danger': obs.status === 'Open',
                'text-info': obs.status === 'In Progress',
                'text-success': obs.status === 'Closed'
              }">
                {{ obs.status }}
              </span>
            </td>


          <td>{{ obs.recommendation }}</td>
          <td>{{ obs.createdAt }}</td>
          <td>
          <button class="btn btn-sm"
                  (click)="openEditObservationModal(obs)"
                  ngbTooltip="Edit Observation"
                  placement="top">
            <i class="fas fa-edit text-secondary"></i>
          </button>

          <button class="btn btn-sm"
                  (click)="deleteObservation(obs.id)"
                  ngbTooltip="Delete Observation"
                  placement="top">
            <i class="fas fa-trash text-danger"></i>
          </button>
        </td>

        </tr>
      </tbody>
    </table>
  </div>
</div>


<!-- Modal -->
<div class="modal fade show" *ngIf="isAddEditModalVisible"
     style="display:block; background:rgba(0,0,0,0.5)"
     (click)="closeModal()">
  <div class="modal-dialog" (click)="$event.stopPropagation()">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">{{ isEditMode ? 'Edit Observation' : 'Add Observation' }}</h2>
        <button type="button" class="btn-close" (click)="closeModal()"></button>
      </div>
      <form [formGroup]="observationForm" (ngSubmit)="saveObservation()">
        <div class="modal-body">
          <div class="mb-3">
            <label>Description</label>
            <textarea formControlName="description" class="form-control"></textarea>
          </div>
          <div class="mb-3">
            <label>Severity</label>
            <select formControlName="severity" class="form-select">
              <option>High</option>
              <option>Medium</option>
              <option>Low</option>
            </select>
          </div>
          <div class="mb-3">
            <label>Status</label>
            <select formControlName="status" class="form-select">
              <option>Open</option>
              <option>In Progress</option>
              <option>Closed</option>
            </select>
          </div>
          <div class="mb-3">
            <label>Recommendation</label>
            <input formControlName="recommendation" class="form-control">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary save-btn">{{ isEditMode ? 'Update' : 'Save' }}</button>
        </div>
      </form>
    </div>
  </div>
</div>
