<div class="container mt-3">
  <h3>Observations for Audit #{{ auditId }}</h3>
  <table class="table table-bordered mt-3">
    <thead>
      <tr>
        <th>Description</th>
        <th>Severity</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let obs of observations">
        <td>{{ obs.description }}</td>
        <td><span class="badge" [ngClass]="{
              'bg-danger': obs.severity === 'High',
              'bg-warning': obs.severity === 'Medium',
              'bg-success': obs.severity === 'Low'
            }">{{ obs.severity }}</span></td>
        <td>{{ obs.status }}</td>
      </tr>
    </tbody>
  </table>
</div>
