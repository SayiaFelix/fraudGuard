<div class="row" style="margin-top: -60px;">
  <!-- Main Content Column -->
  <div class="col content-column">
    <div class="container-fluid">
      <h2>AI Agents</h2>

      <div class="ai-tab-buttons">
        <a class="ai-tab-button" [routerLink]="['general']" routerLinkActive="active-tab" [routerLinkActiveOptions]="{ exact: true }">
          <i class="mdi mdi-plus"></i> General
        </a>
        <a class="ai-tab-button" [routerLink]="['action']" routerLinkActive="active-tab">
          <i class="mdi mdi-eye"></i> Action
        </a>
        <a class="ai-tab-button" [routerLink]="['llm']" routerLinkActive="active-tab">
          <i class="mdi mdi-chart-bar"></i> LLM
        </a>
        <a class="ai-tab-button" [routerLink]="['llm']" routerLinkActive="active-tab">
          <i class="mdi mdi-account-multiple"></i> Voice
        </a>
        <a class="ai-tab-button" [routerLink]="['publish']" routerLinkActive="active-tab">
          <i class="mdi mdi-upload"></i> Publish
        </a>
      </div>

      <div class="mt-4">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>

  <!-- Toggleable Conversation Tester Panel -->
  <div
    class="conversation-panel"
    [ngClass]="{ 'collapsed': isCollapsed }"
  >
    <!-- Header: Entire area clickable -->
    <div class="panel-header d-flex align-items-center justify-content-start p-2"
        (click)="isCollapsed = !isCollapsed" style="cursor: pointer;">
      <!-- Toggle Icon -->
      <i class="mdi me-2"
        [ngClass]="{ 'mdi-chevron-left': isCollapsed, 'mdi-chevron-right': !isCollapsed }">
      </i>
      <h2  *ngIf="!isCollapsed" class="mb-0">Conversation Tester</h2>
    </div>

    <!-- Panel Body -->
    <div *ngIf="!isCollapsed" class="panel-body p-3">
      <p>This is the conversation tester panel content.</p>
    </div>
  </div>


</div>
