<div class="row" style="margin-top: -60px;">
  <!-- Main Content Column -->
  <div class="col content-column">
    <div class="container-fluid">
      <h2>AI Agents</h2>

      <div class="ai-tab-buttons">
        <a class="ai-tab-button" [routerLink]="['general']" routerLinkActive="active-tab" [routerLinkActiveOptions]="{ exact: true }">
          <i class="mdi mdi-plus"></i> General
        </a>

        <a class="ai-tab-button" [routerLink]="['action']" routerLinkActive="active-tab">
          <i class="mdi mdi-eye"></i> Action
        </a>
        <a class="ai-tab-button" [routerLink]="['llm']" routerLinkActive="active-tab">
          <i class="mdi mdi-chart-bar"></i> LLM
        </a>
        <a class="ai-tab-button" [routerLink]="['llm']" routerLinkActive="active-tab">
          <i class="mdi mdi-account-multiple"></i> Voice
        </a>
        <a class="ai-tab-button" [routerLink]="['publish']" routerLinkActive="active-tab">
          <i class="mdi mdi-upload"></i> Publish
        </a>
      </div>

      <div class="mt-4">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>

  <!-- Toggleable Conversation Tester Panel -->
   <div class="conversation-panel d-flex flex-column" [ngClass]="{ 'collapsed': isCollapsed }" style="height: 100vh;">
  <!-- Header -->
  <div class="panel-header d-flex align-items-center justify-content-start p-2" (click)="isCollapsed = !isCollapsed" style="cursor: pointer;">
    <i class="mdi me-2" [ngClass]="{ 'mdi-chevron-left': isCollapsed, 'mdi-chevron-right': !isCollapsed }"></i>
    <h2 *ngIf="!isCollapsed" class="mb-0">Chatbot Tester</h2>
  </div>

  <!-- Panel Body -->
  <div *ngIf="!isCollapsed" class="panel-body p-3 d-flex flex-column flex-grow-1" style="overflow: hidden;">

    <!-- Chat Window -->
    <div class="chat-window flex-grow-1 mb-2 overflow-auto" #chatContainer>
      <div *ngFor="let msg of messages" class="mb-2">
        <div [ngClass]="{ 'd-flex justify-content-end': msg.sender === 'user', 'd-flex justify-content-start': msg.sender === 'bot' }">
          <div class="bubble" [ngClass]="msg.sender">{{ msg.text }}</div>
        </div>
      </div>
      <div *ngIf="isTyping" class="text-start mt-2">
        <em class="text-muted">Bot is typing...</em>
      </div>
    </div>

    <!-- Input Area -->
    <div class="input-group">
      <input type="text" class="form-control" [(ngModel)]="userMessage" placeholder="Type a message..."
             (keydown.enter)="sendMessage()"/>
      <button class="btn btn-primary" (click)="sendMessage()" [disabled]="!chatbotData?.id">Send</button>
    </div>
  </div>
</div>




</div>
