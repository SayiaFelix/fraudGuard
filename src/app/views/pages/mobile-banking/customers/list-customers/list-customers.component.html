<div
  class="d-flex justify-content-between align-items-center flex-wrap grid-margin"
>
  <div>
    <h4 class="mb-3 mb-md-0">All Customers</h4>
  </div>

  <app-table-header
    [allColumns]="allColumns"
    [rows]="filteredRows.length > 0 ? filteredRows : rows"
    [title]="title"
    [showAddButton]="false"
    (changeColumnsEvent)="updateColumns($event)"
    (openAddModalEvent)="openAddProductModal()"
  ></app-table-header>

</div>


<div class="row">
  <div class="col-md-12 stretch-card">
    <div class="card" *ngIf="rows.length > 0">
        <app-custom-ngx-table
          [columns]="columns"
          [rows]="rows"
          [actions]="actions"
          [loadingIndicator]="loading"
          [totalItems]="total"
          (outputEvent)="triggerEvent($event)"
          (viewEvent)="navigateToViewProduct($event)"
          (updateFilteredRows)="updateFilteredRowsEvent($event)"
        ></app-custom-ngx-table>
    </div>
  </div>
</div>
