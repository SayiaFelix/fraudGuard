<div>
  <div class="modal-header">
    <h5 class="modal-title" id="exampleModalLabel">{{title}}</h5>
    <button (click)="closeModal()" aria-label="Close" class="btn-close" type="button"></button>
  </div>
  <div [formGroup]="form" class="modal-body">
    <div class="row g-3">

      <div class="col-12">
        <label class="form-label">Workflow Name</label>
        <input class="form-control" formControlName="name" type="text"/>
        <small
          *ngIf="
            form.get('name')?.touched &&
            form.get('name')?.hasError('required')
          "
          class="text-danger"
        >Required Field</small
        >
      </div>
      <div class="col-12">
    
        <label class="form-label">Role</label>
        <select class="form-select">
          <option>Role</option>
          <option> Create Mandate </option>
          <option> Update Mandate </option>
        </select>
   
      </div>

      <div class="col-12">
          <label class="text-gray">Remarks</label>
          <textarea
            class="form-control"
            formControlName="description"
            type="text"
          ></textarea>
          <small
            *ngIf="
              form.get('description')?.touched &&
              form.get('description')?.hasError('required')
            "
            class="text-danger"
          >Required Field</small
          >
        </div>
      <div class="col-md-4 mt-4">
        <label class="form-label">Status</label>
        <br>
        <div class="form-check form-check-inline">
          <input class="form-check-input" id="inlineRadio1" name="inlineRadioOptions" type="radio" value="option1">
          <label class="form-check-label" for="inlineRadio1">Active</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" id="inlineRadio2" name="inlineRadioOptions" type="radio" value="option2">
          <label class="form-check-label" for="inlineRadio2">Disable</label>
        </div>
        <small
          *ngIf="form.get('name')?.touched && form.get('name')?.hasError('required')"
          class="text-danger"
        >Required Field</small
        >
      </div>

    </div>
  <div class="modal-footer">
    <button (click)="closeModal()" class="btn btn-secondary" type="button">Close</button>
    <button (click)="closeModal()" class="btn btn-primary" type="button">Create workflow</button>
  </div>
