<div class="d-flex justify-content-between align-items-center flex-wrap grid-margin">
    <div>
      <h4 class="mb-3 mb-md-0">All Users</h4>
    </div>
  <app-table-header
    [allColumns]="allColumns"
    [rows]="rows"
    [title]="title"
    (changeColumnsEvent)="updateColumns($event)"
    (openAddModalEvent)="addUser()"
  ></app-table-header>
  </div>

  <div class="row">
    <div class="col-md-12 stretch-card">
      <div class="card" *ngIf="usersList$ | async">
          <app-custom-ngx-table
            [columns]="columns"
            [rows]="rows"
            [actions]="actions"
            [hasViewAndEdit]="true"
            (outputEvent)="triggerEvent($event)"
          ></app-custom-ngx-table>

        </div>
      <div class="card" *ngIf="!(usersList$ | async)">
        <div class="spinner-border text-success" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        </div>
    </div>
  </div>

  <!-- Modal -->
  <ng-template #verticalCenteredModal let-modal>
    <div class="modal-header">
      <h5 class="modal-title" id="exampleModalLabel">Add User</h5>
      <button (click)="modal.close('by: close icon')" aria-label="Close" class="btn-close" type="button"></button>
    </div>
    <div class="modal-body" [formGroup]="form">
      <div class="row g-3">
        <div class="col-md-6">
            <label class="form-label">First Name</label>
            <input class="form-control" formControlName="name" type="text">
            <small *ngIf="form.get('name')?.touched && form.get('name')?.hasError('required')" class="text-danger">Required
              Field</small>
          </div>

          <div class="col-md-6">
            <label class="form-label">Middle Name</label>
            <input class="form-control" formControlName="name" type="text">
            <small *ngIf="form.get('name')?.touched && form.get('name')?.hasError('required')" class="text-danger">Required
              Field</small>
          </div>
          <div class="col-md-6">
            <label class="form-label">Last Name</label>
            <input class="form-control" formControlName="name" type="text">
            <small *ngIf="form.get('name')?.touched && form.get('name')?.hasError('required')" class="text-danger">Required
              Field</small>
          </div>

        <div class="col-md-6">


            <label class="text-gray">Phone Number</label>
            <input class="form-control" formControlName="description" type="text">
            <small *ngIf="form.get('description')?.touched &&
            form.get('description')?.hasError('required')" class="text-danger">Required
              Field</small>
          </div>
          <div class="col-md-6">
            <label class="text-gray">Email Address</label>
            <input class="form-control" formControlName="description" type="text">
            <small *ngIf="form.get('description')?.touched &&
            form.get('description')?.hasError('required')" class="text-danger">Required
              Field</small>
          </div>
          <div class="col-md-6">


                <label class="text-gray">Select User Profile</label>

                <select
                        class="form-select"
                        formControlName="branch"
                        id="branch"
                        name="branch"
                >

                  <option>Super Admin</option>
                  <option>Admin</option>
                </select>
             </div>

        </div>

      </div>
    <div class="modal-footer">
      <button (click)="modal.close('by: close button')" class="btn btn-secondary" type="button">Close</button>
      <button (click)="modal.close('by: save button')" class="btn btn-primary" type="button">Save changes</button>
    </div>
  </ng-template>
