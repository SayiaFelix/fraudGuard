<nav class="page-breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a routerLink="/mobile-banking/rbac/all-profiles">Profiles</a></li>
    <li class="breadcrumb-item active" aria-current="page">Assign Roles to Profile</li>
  </ol>
</nav>

<div class="card-body">
  <h3 class="text-center mb-3 mt-4">Assign Roles to Profile</h3>
<!--  <p class="text-muted text-center mb-4 pb-2">Add or Remove Roles from Profile.</p>-->
</div>

<div class="row profile-body">
  <!-- left wrapper start -->
  <div class="col-4 col-md-4 col-xl-4">
    <div class="row">
      <div class="col-md-12 grid-margin">
        <div class="card rounded">
          <div class="card-body">
            <div class="d-flex align-items-center justify-content-between mb-2">
              <h6 class="card-title mb-0">Missing Roles</h6>
              <hr>
              <div ngbDropdown>
                <button class="btn p-0 no-dropdown-toggle-icon" id="dropdownMenuButton" ngbDropdownToggle type="button">
                  <i class="feather icon-more-horizontal icon-lg text-muted pb-3px"></i>
                </button>
                <div aria-labelledby="dropdownMenuButton" ngbDropdownMenu>
                  <a (click)="false" class="d-flex align-items-center" href="" ngbDropdownItem><i
                    class="feather icon-edit-2 icon-sm me-2"></i> <span class="">Edit</span></a>
                  <a (click)="false" class="d-flex align-items-center" href="" ngbDropdownItem><i
                    class="feather icon-git-branch icon-sm me-2"></i> <span class="">Update</span></a>
                  <a (click)="false" class="d-flex align-items-center" href="" ngbDropdownItem><i
                    class="feather icon-eye icon-sm me-2"></i> <span class="">View all</span></a>
                </div>
              </div>
            </div>

            <div class="table table-responsive table-striped table-bordered">
              <ngx-datatable
                #table
                (select)="onAddRole($event)"
                [columnMode]="ColumnMode.force"
                [columns]="columns"
                [displayCheck]="displayCheck"
                [footerHeight]="50"
                [limit]="20"
                [loadingIndicator]="missingRolesloading"
                [rowHeight]="'auto'"
                [rows]="pendingDataSet"
                [selectAllRowsOnPage]="false"
                [selected]="selectedAdd"
                [selectionType]="SelectionType.checkbox"
                class="bootstrap"
              >
                <ng-container *ngFor='let column of columns'>

                  <ngx-datatable-column
                    [canAutoResize]="false"
                    [checkboxable]="true"
                    [draggable]="false"
                    [headerCheckboxable]="true"
                    [resizeable]="false"
                    [sortable]="false"
                    [width]="60"
                  >
                  </ngx-datatable-column>

                  <ngx-datatable-column *ngIf='column.name == "ROLE NAME"' name="{{column.name}}"
                                        prop="{{column.prop}}">
                  </ngx-datatable-column>
                </ng-container>

              </ngx-datatable>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- left wrapper end -->
  <!-- middle wrapper start -->
  <div class="col-4 col-md-4 col-xl-4">
    <div class="row">
      <div class="col-md-12 grid-margin">
        <div class="card rounded">
          <div class="card-body">
            <div class="d-flex align-items-center justify-content-between mb-2">
              <h6 class="card-title mb-0">Granted Roles</h6>
              <div ngbDropdown>
                <button class="btn p-0 no-dropdown-toggle-icon" id="dropdownMenuButton1" ngbDropdownToggle
                        type="button">
                  <i class="feather icon-more-horizontal icon-lg text-muted pb-3px"></i>
                </button>
                <div aria-labelledby="dropdownMenuButton" ngbDropdownMenu>
                  <a (click)="false" class="d-flex align-items-center" href="" ngbDropdownItem><i
                    class="feather icon-edit-2 icon-sm me-2"></i> <span class="">Edit</span></a>
                  <a (click)="false" class="d-flex align-items-center" href="" ngbDropdownItem><i
                    class="feather icon-git-branch icon-sm me-2"></i> <span class="">Update</span></a>
                  <a (click)="false" class="d-flex align-items-center" href="" ngbDropdownItem><i
                    class="feather icon-eye icon-sm me-2"></i> <span class="">View all</span></a>
                </div>
              </div>
            </div>

            <div class="table table-responsive table-striped table-bordered">
              <ngx-datatable
                #table
                (select)="onRemoveRole($event)"
                [columnMode]="ColumnMode.force"
                [columns]="columns"
                [displayCheck]="displayCheck"
                [footerHeight]="50"
                [limit]="20"
                [loadingIndicator]="missingRolesloading"
                [rowHeight]="'auto'"
                [rows]="rolesList"
                [selectAllRowsOnPage]="false"
                [selected]="selectedRemove"
                [selectionType]="SelectionType.checkbox"
                class="bootstrap"
              >
                <ng-container *ngFor='let column of columns'>

                  <ngx-datatable-column
                    [canAutoResize]="false"
                    [checkboxable]="true"
                    [draggable]="false"
                    [headerCheckboxable]="true"
                    [resizeable]="false"
                    [sortable]="false"
                    [width]="60"
                  >
                  </ngx-datatable-column>

                  <ngx-datatable-column *ngIf='column.name == "ROLE NAME"' name="{{column.name}}"
                                        prop="{{column.prop}}">
                  </ngx-datatable-column>
                </ng-container>

              </ngx-datatable>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- middle wrapper end -->
  <!-- right wrapper start -->
  <div class="col-4 col-md-4 col-xl-4">
    <div class="row">
      <div class="col-md-12 grid-margin">
        <div class="card rounded">
          <div class="card-body">
            <div class="d-flex align-items-center justify-content-between mb-2">
              <h6 class="card-title mb-0">Updated Roles</h6>
              <div ngbDropdown>
                <button class="btn p-0 no-dropdown-toggle-icon" id="dropdownMenuButton3" ngbDropdownToggle
                        type="button">
                  <i class="feather icon-more-horizontal icon-lg text-muted pb-3px"></i>
                </button>
                <div aria-labelledby="dropdownMenuButton" ngbDropdownMenu>
                  <a (click)="false" class="d-flex align-items-center" href="" ngbDropdownItem><i
                    class="feather icon-edit-2 icon-sm me-2"></i> <span class="">Edit</span></a>
                  <a (click)="false" class="d-flex align-items-center" href="" ngbDropdownItem><i
                    class="feather icon-git-branch icon-sm me-2"></i> <span class="">Update</span></a>
                  <a (click)="false" class="d-flex align-items-center" href="" ngbDropdownItem><i
                    class="feather icon-eye icon-sm me-2"></i> <span class="">View all</span></a>
                </div>
              </div>
            </div>

            <h4 class="text-center mx-auto mb-2"><u>Updated Roles Summary</u></h4>


            <div class="card-body pt-0 widget-body pb-1 mb-3 text-center mx-auto">

              <p class="mb-1 text-center"><strong>Added Roles</strong></p>

              <table class="text-left" width="100%">
                <tr *ngFor="let item of allAddedRolesListPending">
                  <td style="text-align: left!important;">{{item.name}}</td>
                  <td (click)="returnAddedRole(item)" class="float-right"
                      style="text-align: right!important; cursor: pointer">
                    <ng-container aria-label="Close">
                      <i class="fa fa-times fa-sm text-danger mr-2 text-danger"></i>
                      <span class="text-danger">Remove</span>
                    </ng-container>
                  </td>
                </tr>
              </table>
              <div class="col-12">
                <button (click)="changeRolesForProfile('add')" class="btn btn-primary mr-2 pr-2" type="button">Add
                </button>
              </div>              <hr>

              <p class="mb-1 text-center"><strong>Removed Roles</strong></p>
              <table class="text-left" width="100%">
                <tr *ngFor="let item of allRemovedRolesListPending">
                  <td style="text-align: left!important;">{{item.name}}</td>
                  <td (click)="returnRemovedRole(item)" class="float-right"
                      style="text-align: right!important; cursor: pointer ">
                    <ng-container aria-label="Close">
                      <i class="fa fa-times fa-sm text-danger mr-2 text-danger"></i>
                      <span class="text-danger">Remove</span>
                    </ng-container>
                  </td>
                </tr>
              </table>
              <div class="col-12">
                <button (click)="changeRolesForProfile('remove')" class="btn btn-danger mr-2 pr-2" type="button">Remove
                </button>
              </div>
              <hr>

              <!--              <div class="mx-auto text-center mb-2" role="group">-->

              <div class="row">
                <!-- <div class="col-5">
                  <button (click)="changeRolesForProfile()" class="btn btn-primary mr-2 pr-2" type="button">Submit
                  </button>
                </div> -->

                <!-- <div class="col-12"></div> -->

                <div class="col-12">
                  <button (click)="resetRolesForProfile()" class="btn btn-outline-primary" type="button">Reset</button>
                </div>
              </div>
              <!--              </div>-->

            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- right wrapper end -->
</div>
