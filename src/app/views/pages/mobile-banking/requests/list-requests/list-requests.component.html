<div class="card border-0 box-shadow">
  <div class="d-flex justify-content-start mt-3" style="margin-bottom: -3% ; padding-left: 40px;">
    <div>
      <h3 class="card-title" style="color: #1E0F2E; font-family: 'Muli';font-weight: 600;font-size: 16px;">All Standards</h3>
    </div>
  </div>
  <div class="card-body p-2">
    <div class="border-0 box-shadow">
      <div class="grid-margin stretch-card">
        <div class="row " style="padding: 0px 30px">
          <div class="col-md-3 col-lg-3 col-xl-3 col-sm-4 mt-3 pt-2" *ngFor="let std of standards">
            <div class="" [id]="std.id">
              <div style="position: relative; display: inline-block;">
                <div>
                  <img class="img-fluid card-img-top"
                    style="height: 85px; border-top-left-radius: 13px; border-top-right-radius: 13px;"
                    [src]="std.icon" />
                </div>
                <div
                  style="position: absolute; width: 50px; height: 50px; margin-left: 4%; margin-top: -11%; border-radius: 50%; background-color: #D0DDF0;"
                  class="card-header d-flex justify-content-center align-items-center border-0 box-shadow">
                </div>
              </div>
              <br><br>
              <div style="position: relative;">
                <div class="mt-2">
                  <p style="color: #2268AA; font-family: 'Muli';font-weight: 600;font-size: 14px;" class="h2"> <a href="" target="_blank" routerLink="/standards/Id">{{std.name}}</a></p>
                </div>
                <div class="mt-2">
                  <p style="color: #1E0F2E; font-family: 'Muli';font-weight: 400;font-size: 12px;" class="h3">
                    {{std.describe}}
                  </p>
                </div>
              </div>   
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
