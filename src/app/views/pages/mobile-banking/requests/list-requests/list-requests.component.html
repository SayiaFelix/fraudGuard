<div class="card border-0 box-shadow">
  <div class="d-flex justify-content-start mt-3" style="margin-bottom: -40px; padding-left: 3%;">
    <div class="card-title">
      <h3 style="color: #1E0F2E; font-family: 'Mulish';font-weight: 600;font-size: 20px; text-transform: none;">All
        Standards</h3>
    </div>
  </div>
  <ng-container *ngIf="showLeaveCommentForm">
    <div class="modal-container"
      style="display: flex;justify-content: end;align-items: center;position: fixed;width: 100%;height: 100%; z-index: 10;  border-radius: 8px 8px 8px 8px;">
      <div>
        <div class="modals " style="border-radius: 8px 8px 8px 8px;">
          <div style="background: var(--seasalt, #F8F8F8); border-radius: 8px 8px 8px 8px;">
            <div class="d-flex justify-content-between"
              style="background-color: #d0ddf0;  font-family: 'Mulish'; font-weight: 900; border-radius:4px;">
              <h4 class="text-start p-2 mt-2" style="color: #6D36A8; font-size: 23px;">Customer Inquiry</h4>
              <div>
                <button type="button" class="btn fs-2" (click)="hideLeaveCommentForm()"
                  style="color: #6D36A8; font-size: 20px; margin-top: -5%;">
                  &times;
                </button>
              </div>
            </div>
            <article class="">
              <form class="mt-1" [formGroup]="form" (ngSubmit)="onleaveComment()" class="row px-3">
                <div class="tab-content col-12 border-0">
                  <div class="form-group mt-2">
                    <input formControlName="name" type="text" class="form-control validation-field border-0" id="name"
                      placeholder="Your Name or Company*">
                    <small class="text-danger" *ngIf="f.name.touched && f.name.errors?.required">Field Required</small>
                  </div>
                  <div class="form-group mt-2">
                    <input formControlName="email" type="email" class="form-control validation-field border-0" id="email"
                      placeholder="Your email address*">
                    <small class="text-danger" *ngIf="f.email.touched && f.email.errors?.required">Field Required</small>
                    <small class="text-danger" *ngIf="f.email.touched && f.email.errors?.email">Email Format Required</small>
                  </div>
                  <div class="form-group mt-2">
                    <input type="text" name="tel" formControlName="phone_number" id="phoneNumber"
                      placeholder="Phone Number*" class="form-control validation-field border-0 w-100" ng2TelInput
                      data-initial-country="ke">
                    <small class="text-danger" *ngIf="f.phone_number.touched && f.phone_number.errors?.required">Field Required</small> <br>
                    <small class="text-danger" *ngIf="f.phone_number.touched && f.phone_number.errors?.invalidPhoneNumber">Phone Number: 254 *** *** ***</small>
                  </div>
                  <div class="form-group mt-2">
                    <input formControlName="subject" type="text" class="form-control validation-field border-0"
                      id="occupation" placeholder="Subject">
                    <small class="text-danger" *ngIf="f.subject.touched && f.subject.errors?.required">Field Required</small>
                  </div>
                  <div class="form-group mt-2">
                    <textarea formControlName="message" type="text" id="message" cols="15" rows="3" 
                    placeholder="Message" class="form-control validation-field border-0"></textarea>
                    <small class="text-danger" *ngIf="f.message.touched && f.message.errors?.required">Field Required</small>
                  </div>
                  <div class="col-12 bg-white text-center py-1 mt-3 mb-2">
                    <button [disabled]="!form.valid" style="width: 100%; border: none;" class="btn btn-block bronchure-btn transition"
                      type="submit">
                      <span style="color: white;">SEND</span>
                    </button>
                  </div>
                </div>
              </form>
            </article>
          </div>
        </div>
      </div>
    </div>
  </ng-container>
  <div class="card-body p-1">
    <div class="border-0 box-shadow">
      <div class="grid-margin stretch-card">
        <div class="row" style="padding: 0px 2%">
          <div class="col-md-3 col-sm-3 col-lg-3 col-xl-3  mt-3 pt-2" *ngFor="let std of standards">
            <div [id]="std.id" (click)="openStandardInNewTab(std.id)">
              <div style="position: relative; display: inline-block;">
                <div class="w-100">
                  <!-- <img class="img-fluid card-img-top" [src]="std.existingImage"
                    style="height: 95px; max-width: 100%; border-top-left-radius: 13px; border-top-right-radius: 13px;"/> -->
                  <img class="img-fluid card-img-top"
                    style="min-height: 95px; max-width: 100%; border-top-left-radius: 13px; border-top-right-radius: 13px;"
                    src="assets/images/3.png" alt="">
                </div>
                <div
                  style="position: absolute; width: 60px; height: 60px; margin-left: 4%; margin-top: -11%; border-radius: 50%; background-color: #D0DDF0;"
                  class="card-header d-flex justify-content-center align-items-center border-0 box-shadow">
                  <img class="img-fluid card-img-top" [src]="std.existingIcon"
                  style="height: 30px; max-width: 30px;"/>
                </div>
              </div>
              <br><br><br>
              <div style="position: relative;">
                <div class="mt-3">
                  <p style="
                        color: #2268aa;
                        font-family: 'Muli';
                        font-weight: 600;
                        font-size: 16px;
                        line-height: 21px;
                      " class="h2">
                    {{ std.title }}
                  </p>
                  <!-- <p style="color: #2268AA; font-family: 'Muli';font-weight: 600;font-size: 15px;" class="h2"> <a href="" routerLink="/standards/Id">{{std.name}}</a></p> -->
                </div>
                <div class="">
                  <p style="
                        color: #1e0f2e;
                        font-family: 'Muli';
                        font-weight: 400;
                        font-size: 12px;
                        line-height: 21px;
                      " class="h3">
                    {{ std.description }}
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="d-flex justify-content-end">
    <div style="position: fixed; bottom: 9%; right:3%;" class="d-flex justify-content-around">
      <button *ngIf="!showLeaveCommentForm" class="btn btn-sm transition"
        style="border-radius: 64px;background: var(--green-blue, #2268AA); margin-right:10px;" type="submit">
        <a style="text-decoration: none" class="transition">
          <span
            style="color: var(--seasalt, #F8F8F8);text-align: center;font-family: Mulish;font-size: 12px;font-style: normal;font-weight: 700;line-height: normal;letter-spacing: 1.12px;text-transform: uppercase;">customer
            inquiry</span></a>
      </button>
      <div (click)="toggleLeaveCommentForm()"
        style="width: 50px; height: 50px; border-radius: 50%; background-color: #D0DDF0;;"
        class="card-header d-flex align-items-center border-0">
        <p style="color:#2268AA;  font-size: 30px; margin-left: -13px;">
          <img class="img-fluid" style="position: absolute; bottom: 19%" src="assets/images/chats.png" width="30"
            height="20" alt="logo" />
          <!-- <i (click)="openModal(leaveComment)" class="mt-2 fa-solid fa-comments" title="Leave A Comment"></i> -->
        </p>
      </div>
    </div>
  </div>
  <hr>
</div>
