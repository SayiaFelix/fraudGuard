
<div class="d-flex justify-content-between align-items-center flex-wrap grid-margin mt-1"
style="box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); border-radius: 5px; padding: 10px;">
<div>
  <h4 class="mb-3 mb-md-0"
    style="color: var(--dark-purple, #1e0f2e); font-family: Muli; font-size: 20px; font-style: normal; font-weight: 700; line-height: 26px;">
    Processed Transaction Analytics
  </h4>
</div>
</div>
<hr>

<div class="card border-0 box-shadow">
  <div class="container mt-2">
    <div class="row g-4">
      <div class="col-12 col-md-6 col-lg-6 col-sm-12" *ngFor="let dashboard of paginatedDashboards">
        <div class="dashboard-item p-3" style="height: 100%;"> <!-- Fixed parent height -->
          <tableau-viz
            id="{{dashboard.id}}"
            [attr.src]="dashboard.src"  
            class="w-100 h-100" 
            hide-tabs
            toolbar="bottom">
          </tableau-viz>
        </div>
      </div>
    </div>
    <div class="pagination mt-3 d-flex justify-content-end">
      <button class="btn btn-primary me-2" (click)="prevPage()" [disabled]="currentPage === 0">
        Previous
      </button>
      <button class="btn btn-success" (click)="nextPage()" [disabled]="(currentPage + 1) * itemsPerPage >= dashboards.length">
        Next
      </button>
    </div>
  </div>
</div>
<hr>
<div>
  <footer class="footer mt-3 d-flex flex-column flex-md-row align-items-center justify-content-between px-4 border-top small">
    <p class="text-muted">Copyright © 2024 <a href="" style="color: #6d36a8; font-family: 'Muli';" target="_blank">Analytics</a></p>
    <p class="" style="color: #6d36a8; font-family: 'Muli'; font-style: normal; font-weight: 700; font-size: 13px; letter-spacing: 0.08em;">Faulu Bank Kenya</p>
  </footer>
</div>
