<div class="card border-0 box-shadow">
  <div class="d-flex justify-content-start mt-3" style="margin-bottom: -40px; padding-left: 30px;">
    <div class="card-title">
      <h3 style="color: #1E0F2E; font-family: 'Mulish';font-weight: 600;font-size: 20px; text-transform: none;">All
        Standards</h3>
    </div>
  </div>
  <a href="" routerLink="/standards/Id" target="_blank">
    <div class="card-body">
      <div class="border-0 box-shadow">
        <div class="grid-margin stretch-card">
          <div class="row " style="padding: 0px 0px">
            <div class="col-md-3 col-lg-3 col-xl-3 col-sm-4 mt-1 pt-2" *ngFor="let std of standards">
              <div class="" [id]="std.id">
                <div style="position: relative; display: inline-block;">
                  <div>
                    <img class="img-fluid card-img-top"
                      style="height: 85px; border-top-left-radius: 13px; border-top-right-radius: 13px;"
                      [src]="std.icon" />
                  </div>
                  <div
                    style="position: absolute; width: 50px; height: 50px; margin-left: 4%; margin-top: -11%; border-radius: 50%; background-color: #D0DDF0;"
                    class="card-header d-flex justify-content-center align-items-center border-0 box-shadow">
                  </div>
                </div>
                <br><br>
                <div style="position: relative;">
                  <div class="mt-3">
                    <p style="
                        color: #2268aa;
                        font-family: 'Muli';
                        font-weight: 600;
                        font-size: 16px;
                        line-height: 21px;
                      " class="h2">
                      {{ std.name }}
                    </p>
                    <!-- <p style="color: #2268AA; font-family: 'Muli';font-weight: 600;font-size: 15px;" class="h2"> <a href="" routerLink="/standards/Id">{{std.name}}</a></p> -->
                  </div>
                  <div class="">
                    <p style="
                        color: #1e0f2e;
                        font-family: 'Muli';
                        font-weight: 400;
                        font-size: 12px;
                        line-height: 21px;
                      " class="h3">
                      {{ std.describe }}
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </a>

</div>
