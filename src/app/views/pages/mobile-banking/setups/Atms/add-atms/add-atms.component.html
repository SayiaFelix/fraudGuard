<div>
  <div class="modal-header">
    <h5 class="modal-title" id="exampleModalLabel">{{title}}</h5>
    <button (click)="closeModal()" aria-label="Close" class="btn-close" type="button"></button>
  </div>
  <div class="modal-body" [formGroup]="form">
    <div class="row">
      <div class="col-sm-12">
        <div class="mb-3">
          <label class="form-label">ATM Name</label>
          <input class="form-control" formControlName="name" type="text">
          <small *ngIf="form.get('name')?.touched && form.get('name')?.hasError('required')" class="text-danger">Required
            Field</small>
        </div>
      </div>
      <div class="col-sm-12">
        <div class="mb-3">
          <label class="text-gray">ATM Code</label>
          <input class="form-control" formControlName="atmCode" type="text">
          <small *ngIf="form.get('atmCode')?.touched &&
          form.get('atmCode')?.hasError('required')" class="text-danger">Required
            Field</small>
        </div>
      </div>
      <div class="col-sm-12">
        <div class="mb-3">
          <label class="text-gray">Select Branch</label>
          <select
            class="form-select"
            formControlName="branch"
            id="branch"
            name="branch"
          >
            <option *ngFor="let item of [{id: 1, name: 'Haile Selassie Avenue'}]"
                    [value]="item.id">
              {{ item.name | titlecase}}

            </option>
            <option *ngFor="let item of [{id: 2, name: 'Harambee Avenue'}]"
                    [value]="item.id">
              {{ item.name | titlecase}}

            </option>
            <option *ngFor="let item of [{id: 3, name: 'Kimathi Street'}]"
                    [value]="item.id">
              {{ item.name | titlecase}}

            </option>
          </select>
        </div>

      </div>

    </div>


  </div>
  <div class="modal-footer">
    <button (click)="closeModal()" class="btn btn-secondary" type="button">Close</button>
    <button (click)="closeModal()" class="btn btn-primary" type="button">Save changes</button>
  </div>
</div>
