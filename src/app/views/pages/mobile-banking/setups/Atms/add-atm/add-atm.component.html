<div>
  <div class="modal-header">
    <h5 class="modal-title" id="exampleModalLabel">{{title}}</h5>
    <button aria-label="Close" class="btn-close" type="button" (click)="close()"></button>
  </div>
  <div class="modal-body">


    <div class="row inbox-wrapper">
      <div class="col-lg-12">
        <div class="card">
          <div class="card-body" [formGroup]="form">
            <div class="row">
              <div class="col-lg-4 border-end-lg">
                <h4 class="text-center mx-auto tx-16 fw-bold">Define Your Region Selection</h4>
                <hr>
                <div class="row justify-content-center mx-auto text-center">
                  <div class="col-sm-12">
                    <div class="mb-3">
                      <label class="form-label">ATM Name</label>
                      <input class="form-control" formControlName="name" type="text">
                      <small *ngIf="form.get('name')?.touched && form.get('name')?.hasError('required')" class="text-danger">Required
                        Field</small>
                    </div>
                  </div>
                  <div class="col-sm-12">
                    <div class="mb-3">
                      <label class="text-gray">ATM Code</label>
                      <input class="form-control" formControlName="atmCode" type="text">
                      <small *ngIf="form.get('atmCode')?.touched &&
          form.get('atmCode')?.hasError('required')" class="text-danger">Required
                        Field</small>
                    </div>
                  </div>
                  <div class="col-sm-12">
                    <div class="mb-3">
                      <label class="text-gray">Select Branch</label>
                      <select
                        class="form-select"
                        formControlName="branch"
                        id="branch"
                        name="branch"
                      >
                        <option *ngFor="let item of [{id: 1, name: 'Haile Selassie Avenue'}]"
                                [value]="item.id">
                          {{ item.name | titlecase}}

                        </option>
                        <option *ngFor="let item of [{id: 2, name: 'Harambee Avenue'}]"
                                [value]="item.id">
                          {{ item.name | titlecase}}

                        </option>
                        <option *ngFor="let item of [{id: 3, name: 'Kimathi Street'}]"
                                [value]="item.id">
                          {{ item.name | titlecase}}

                        </option>
                      </select>
                    </div>

                  </div>

                </div>
              </div>
              <div class="col-lg-8">

                <div class="form-group mb-2">
                  <label>Enter ATM Location</label>
                  <input type="text" class="form-control" (keydown.enter)="$event.preventDefault()" placeholder="Search Nearest Location" autocorrect="off" autocapitalize="off" spellcheck="off" type="text" #search>
                </div>

                <agm-map [latitude]="latitude" [longitude]="longitude" [zoom]="zoom">
                  <agm-marker [latitude]="latitude" [longitude]="longitude" [markerDraggable]="true"
                              (dragEnd)="markerDragEnd($event)"></agm-marker>
                </agm-map>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" type="button" (click)="close()">Close</button>
      <button class="btn btn-primary" type="button">Save changes</button>
    </div>
  </div>
</div>
