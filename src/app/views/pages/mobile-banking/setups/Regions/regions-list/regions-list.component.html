<div class="d-flex justify-content-between align-items-center flex-wrap grid-margin">
  <div>
    <h4 class="mb-3 mb-md-0">All Regions</h4>
  </div>
  <div class="d-flex align-items-center flex-wrap text-nowrap">
    <div class="input-group wd-200 me-2 mb-2 mb-md-0">
    </div>
     <button class="btn btn-outline-primary btn-icon-text me-2 mb-2 mb-md-0 btn-xs" type="button">
      <i appFeatherIcon class="btn-icon-prepend" data-feather="printer"></i>
      Download
    </button>
    <button (click)="openAddProductModal()" class="btn btn-primary btn-icon-text mb-2 mb-md-0 btn-xs"
            type="button">
      <i appFeatherIcon class="btn-icon-prepend" data-feather="plus"></i>
      Add Region
    </button>
  </div>
</div>

<div class="row">
  <div class="col-md-12 stretch-card">
    <div class="card">
      <div class="card-body">
        <h6 class="card-title">Regions</h6>
         <div class="table-responsive table-striped">
          <ngx-datatable
            [rows]="rows"
            class="bootstrap"
            [loadingIndicator]="loadingIndicator"
            [columnMode]="ColumnMode.force"
            [footerHeight]="50"
            [columns]="columns"
            [limit]="2"
            [rowHeight]="'auto'"
          >
                    <!-- Row Detail Template -->
                    <ngx-datatable-row-detail
                    #myDetailRow
                    (toggle)="onDetailToggle($event)"
                    [rowHeight]="100"
                  >
                    <ng-template
                      let-expanded="expanded"
                      let-row="row"
                      ngx-datatable-row-detail-template
                    >
                      <div style="padding-left: 35px">
                        <div><strong>Address</strong></div>
                        <div>{{ row.productName }}, {{ row.remarks }}</div>
                      </div>
                    </ng-template>
                  </ngx-datatable-row-detail>
      
                  <!-- Column Templates -->
                  <ngx-datatable-column
                    [canAutoResize]="false"
                    [draggable]="false"
                    [resizeable]="false"
                    [sortable]="false"
                    [width]="50"
                  >
                    <ng-template
                      let-expanded="expanded"
                      let-row="row"
                      let-value="value"
                      ngx-datatable-cell-template
                    >
                      <a
                        (click)="toggleExpandRow(row)"
                        [class.datatable-icon-down]="expanded"
                        [class.datatable-icon-right]="!expanded"
                        href="javascript:void(0)"
                        title="Expand/Collapse Row"
                      >
                      </a>
                    </ng-template>
                  </ngx-datatable-column>
            <ng-container *ngFor='let column of columns' >
              <ngx-datatable-column *ngIf='column.name === "Actions"' name="Actions" prop="actions">
                <ng-template let-value="value" let-row="row" ngx-datatable-cell-template>
                    <span>
                      <button type="button" class="btn btn-outline-primary btn-icon-text me-2  btn-xs" (click)="navigateToViewProduct(row)">
                          View
                      </button>
                      <button type="button" class="btn btn-primary btn-icon-text btn-xs" (click)="openEditProductModal(row)">
                          Edit
                      </button>
                    </span>
                </ng-template>
              </ngx-datatable-column>
              <ngx-datatable-column *ngIf='column.name !== "Actions"' name="{{column.name}}" prop="{{column.prop}}">
              </ngx-datatable-column>
            </ng-container>

          </ngx-datatable>
        </div>
      </div>
    </div>
  </div>
</div>
