<div class="d-flex justify-content-between align-items-center flex-wrap grid-margin">
  <div>
    <h4 class="mb-3 mb-md-0">All Regions</h4>
  </div>
  <app-table-header
    [allColumns]="allColumns"
    [rows]="rows"
    [title]="title"
    (changeColumnsEvent)="updateColumns($event)"
    (openAddModalEvent)="addRegion()"
  ></app-table-header>
</div>

<div class="row">
  <div class="col-md-12 stretch-card">
    <div class="card">
      <div class="card-body">
        <h6 class="card-title">Regions</h6>
        <app-custom-ngx-table
          [columns]="columns"
          [rows]="rows"
          [hasViewAndEdit]="false"
          (editEvent)="openEditRegionsModal($event)"></app-custom-ngx-table>
      </div>
    </div>
  </div>
</div>
