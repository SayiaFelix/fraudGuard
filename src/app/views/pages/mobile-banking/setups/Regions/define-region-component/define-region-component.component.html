<div>
  <div class="modal-header">
    <h5 class="modal-title" id="exampleModalLabel">{{title}}</h5>
    <button aria-label="Close" class="btn-close" type="button" (click)="close()"></button>
  </div>
  <div class="modal-body">


    <div class="row inbox-wrapper">
      <div class="col-lg-12">
        <div class="card">
          <div class="card-body" [formGroup]="form">
            <div class="row">
              <div class="col-lg-4 border-end-lg">
                <h4 class="text-center mx-auto tx-16 fw-bold">Define Your Region Selection</h4>
                <hr>

                <div class="row justify-content-center mx-auto text-center">

                  <div class="mb-3">
                    <label for="regionName" class="form-label">Region Name:</label>
                    <input type="text" formControlName="regionName" class="form-control" id="regionName" placeholder="Enter Region Name">
                    <small class="text-danger" *ngIf="form.get('regionName')?.touched && form.get('regionName')?.hasError('required')">Region is required</small>
                  </div>

                  <div class="mb-3">
                    <label for="regionCode" class="form-label">Region Code:</label>
                    <input type="text" formControlName="regionCode" class="form-control" id="regionCode" placeholder="Enter Region Code">
                    <small class="text-danger" *ngIf="form.get('regionCode')?.touched && form.get('regionCode')?.hasError('required')">Region is required</small>
                  </div>

                  <ng-container *ngIf="radioValue ==='Predefined'">

                    <label class="pt-1 form-label">Administrative Region:</label>
                    <select (ngModelChange)="zoneChanged($event)" [(ngModel)]="administationZoneType" aria-label="Select Administrative Region"
                            class="form-control form-select mb-2" name="administationZoneType">
                      <option value="County">County</option>
                      <option value="Constituency">Constituency</option>
                    </select>

                    <label class="pt-1"></label>
                    <select (ngModelChange)="regionSelected($event)" aria-label="Select Administrative Region" class="form-select"
                            name="administationZoneType" ngModel="zone">
                      <option *ngFor="let region of regions" [value]="region">{{region}}</option>
                    </select>

                  </ng-container>

                </div>


              </div>
              <div class="col-lg-8">
                <div #updatedMap>
                  <agm-map (mapReady)="onMapReady($event)" [latitude]="lat" [longitude]="lng" [zoom]="8">
                    <agm-polygon [fillColor]="'#1890FF'" [paths]="pointList" [strokeColor]="'#1890FF'" [strokeWeight]="2">
                    </agm-polygon>

                  </agm-map>

                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" type="button" (click)="close()">Close</button>
      <button class="btn btn-primary" type="button">Save changes</button>
    </div>
  </div>
</div>
