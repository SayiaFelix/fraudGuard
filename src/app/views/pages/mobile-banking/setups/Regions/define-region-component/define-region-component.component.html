<div>
  <div class="modal-header">
    <h5 class="modal-title" id="exampleModalLabel">{{title}}</h5>
    <button (click)="close()" aria-label="Close" class="btn-close" type="button"></button>
  </div>
  <div class="modal-body">


    <div class="row inbox-wrapper">
      <div class="col-lg-12">
        <div class="card">
          <div [formGroup]="form" class="card-body">
            <div class="row">
              <div class="col-lg-4 border-end-lg">
                <h4 class="text-center mx-auto tx-16 fw-bold">Define Your Region Selection</h4>
                <hr>

                <div class="row justify-content-center mx-auto text-center">

                  <div class="mb-3">
                    <label class="form-label" for="regionName">Region Name:</label>
                    <input class="form-control" formControlName="name" id="name" placeholder="Enter Region Name"
                           type="text">
                    <small *ngIf="form.get('name')?.touched && form.get('name')?.hasError('required')"
                           class="text-danger">Region
                      is required</small>
                  </div>

                  <div class="mb-3">
                    <label class="form-label" for="regionCode">Region Code:</label>
                    <input class="form-control" formControlName="code" id="code" placeholder="Enter Region Code"
                           type="text">
                    <small *ngIf="form.get('code')?.touched && form.get('code')?.hasError('required')"
                           class="text-danger">Region
                      is required</small>
                  </div>

                  <ng-container *ngIf="radioValue ==='Predefined'">

                    <label class="pt-1 form-label">Administrative Region:</label>
                    <select
                      aria-label="Select Administrative Region"
                      class="form-control form-select mb-2"
                      formControlName="zone" name="administationZoneType" (change)="showSelectionChange()">
                      <option value="County">County</option>
                      <option value="Constituency">Constituency</option>
                    </select>

                    <label class="pt-1"></label>
                    <select (change)="regionSelected()" aria-label="Select Administrative Region"
                            class="form-select"
                            name="administationZoneType" formControlName="selectedZone">
                      <option *ngFor="let region of regions" [value]="region">{{region}}</option>
                    </select>
                    <!-- <option *ngFor="let region of Regions "
                    [value]="region.id">
              {{ region.name | titlecase}}
            </option> -->

                  </ng-container>

                </div>


              </div>
              <div class="col-lg-8">
                <div #updatedMap>
                  <agm-map (mapReady)="onMapReady($event)" [latitude]="lat" [longitude]="lng" [zoom]="8">
                    <agm-polygon [fillColor]="'#1890FF'" [paths]="pointList" [strokeColor]="'#1890FF'"
                                 [strokeWeight]="2">
                    </agm-polygon>

                  </agm-map>

                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button (click)="close()" class="btn btn-secondary" type="button">Close</button>
      <button class="btn btn-primary" (click)="submitData()" *ngIf="!this.formData" type="button">Create Region</button>
      <button class="btn btn-primary" (click)="submitData()" *ngIf="this.formData" type="button">Save changes</button>
  </div>
</div>
