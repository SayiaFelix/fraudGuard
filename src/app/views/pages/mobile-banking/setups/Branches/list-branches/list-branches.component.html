<div class="container mt-2">
  <!-- Conditional to check if there are any dashboards -->
  <div *ngIf="paginatedDashboards && paginatedDashboards.length > 0; else noData">
    <div class="row g-4">
      <div class="col-12 col-md-6 col-lg-6 col-sm-12" *ngFor="let dashboard of paginatedDashboards">
        <div class="dashboard-item p-3" style="height: 100%;">
          <tableau-viz
            id="{{ dashboard.id }}"
            [attr.src]="dashboard.src"
            class="w-100 h-100"
            hide-tabs
            toolbar="bottom"
          ></tableau-viz>
        </div>
      </div>
    </div>
    <!-- Pagination -->
    <div class="pagination mt-3 d-flex justify-content-end">
      <button
        class="btn btn-primary me-2"
        (click)="prevPage()"
        [disabled]="currentPage === 0"
      >
        Previous
      </button>
      <button
        class="btn btn-success"
        (click)="nextPage()"
        [disabled]="(currentPage + 1) * itemsPerPage >= dashboards.length"
      >
        Next
      </button>
    </div>
  </div>

  <!-- No data message -->
  <ng-template #noData>
    <div class="no-data-message text-center mt-5">
      <h3 style="color:#6d36a8;">No LOG analytics visuals available now</h3>
      <p class="text-muted">Please check back later when dashboards are available.</p>
    </div>
    <br>
  </ng-template>
</div>
