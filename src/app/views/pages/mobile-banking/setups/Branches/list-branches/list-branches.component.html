<div  class="container-fluid user-page-wrapper">
  <div class="row">

    <div class="col-lg-8 col-md-7"
         [ngClass]="{'col-lg-12 col-md-12': !isDetailsPanelVisible, 'col-lg-8 col-md-7': isDetailsPanelVisible}">
      <div class="user-page">
        <h1 class="h3 mb-4">User Management</h1>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="input-group w-50">
            <span class="input-group-text"><i class="fas fa-search"></i></span>
            <input
              type="text"
              class="form-control"
              placeholder="Search by email or username..."
              [(ngModel)]="searchTerm"
              (ngModelChange)="applyFiltersAndPagination()"
            >
          </div>
          <button class="btn btn-sm btn-primary btn-test" (click)="openAddUserModal()">
            <i class="fas fa-plus"></i> Add Auditor
          </button>
        </div>

        <!-- Table -->
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th scope="col">ID</th>
                <th scope="col">Username</th>
                <th scope="col">Email</th>
                <th scope="col">Role</th>
              </tr>
            </thead>
            <tbody *ngIf="visibleUsers.length > 0; else noUsers">
              <tr
                *ngFor="let user of visibleUsers"
                (click)="showUserDetails(user)"
                [class.table-active]="selectedUser && selectedUser.id === user.id"
                style="cursor:pointer"
              >
                <td>{{ user.id }}</td>
                <td>{{ user.username }}</td>
                <td>{{ user.email }}</td>
                <td>{{ user.role }}</td>
              </tr>
            </tbody>
          </table>
        </div>

        <ng-template #noUsers>
          <div class="alert alert-info">No users found</div>
        </ng-template>
      </div>
    </div>

    <div class="col-lg-4 col-md-5 bg-white border-start shadow-sm details-panel"
        *ngIf="isDetailsPanelVisible">
      <div class="mt-3 p-3 d-flex justify-content-between align-items-center border-bottom">
        <h2 class="h3  mb-0"><i class="fas fa-user-circle me-2"></i> Profile</h2>
        <button class="btn btn-sm btn-outline-secondary" (click)="hideUserDetails()">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div class="p-4 text-center" *ngIf="selectedUser; else loadingTemplate">
        <!-- Avatar -->
        <div class="mb-1">
          <i class="fas fa-user-circle fa-6x text-secondary"></i>
        </div>

        <!-- Username + Role Badge -->
        <h3 class="mb-1">{{ selectedUser.username }}</h3>
        <span class="badge" [ngClass]="getRoleBadgeClass(selectedUser.role)">{{ selectedUser.role }}</span>

        <hr class="my-4">
        <div class="text-start small">
          <p><strong>Email:</strong> {{ selectedUser.email }}</p>
          <p><strong>Role:</strong> {{ selectedUser.role }}</p>
        </div>

        <div class="d-flex justify-content-between mt-3">
          <button class="btn btn-outline-primary btn-sm w-50 me-2" (click)="openEditUserModal(selectedUser)">
            <i class="fas fa-edit me-1"></i> Edit
          </button>
          <button class="btn btn-outline-danger btn-sm w-50" (click)="deleteUser(selectedUser.id)">
            <i class="fas fa-trash-alt me-1"></i> Delete
          </button>
        </div>
      </div>

      <ng-template #loadingTemplate>
        <div class="p-4 text-center">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="mt-2">Loading user details...</p>
        </div>
      </ng-template>
    </div>
  </div>
   
   <div
    class="modal fade show custom-modal-backdrop"
    tabindex="-1"
    *ngIf="isAddUserModalVisible"
    style="display:block; background: rgba(0,0,0,0.5);"
    (click)="closeAddUserModal()"
  >
    <div
      class="modal-dialog"
      (click)="$event.stopPropagation()"
    >
      <div class="modal-content">
        <div class="modal-header">
            <h1 class="h3 mb-0">Add Auditor</h1>
          <button type="button" class="btn-close" (click)="closeAddUserModal()"></button>
        </div>

        <form [formGroup]="addUserForm" (ngSubmit)="saveUser()">
          <div class="modal-body">
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input id="username" formControlName="username" type="text" class="form-control" placeholder="Enter username">
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input id="email" formControlName="email" type="email" class="form-control" placeholder="Enter email">
            </div>

            <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
              <input
                id="password"
                formControlName="password"
                [type]="showPassword ? 'text' : 'password'"
                class="form-control"
                placeholder="Enter password"
              >
              <button
                type="button"
                class="btn btn-outline-secondary"
                (click)="showPassword = !showPassword"
                type="button"
              >
                <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
              </button>
            </div>
          </div>

            <div class="mb-3">
              <label for="role" class="form-label">Role</label>
              <select id="role" formControlName="role" class="form-select">
                <option value="">Select a role</option>
                <option value="CIA">Chief Internal Auditor</option>
                <option value="Auditor">Auditor</option>
                <option value="AuditUnit">Audit Unit</option>
              </select>
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-sm btn-secondary" (click)="closeAddUserModal()">Cancel</button>
            <button type="submit" class="btn btn-sm btn-primary btn-test" [disabled]="addUserForm.invalid">Save Auditor</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
