<div class="row w-100 mx-0 auth-page">
  <div class="col-md-8 col-xl-6 mx-auto">
    <div class="card">
      <div class="row">
        <div class="col-md-4 pe-md-0">
          <div class="auth-side-wrapper" [ngStyle]="{ 'background-image': 'url(\'/assets/images/misc/login.jpg\')' }">
<!--          <div class="auth-side-wrapper" [ngStyle]="{ 'background-image': 'url(https://eclectics.io/wp-content/uploads/assets/eclectics.svg)' }">-->
          </div>
        </div>
        <div class="col-md-8 ps-md-0">
          <div class="auth-form-wrapper px-4 py-5">
            <a routerLink="." class="nobleui-logo d-block mb-2">Eclectics <span>Channel Manager</span></a>
            <h5 class="text-muted fw-normal mb-4">Log in to your account.</h5>
            <form class="forms-sample" [formGroup]="form">
              <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" formControlName="username" class="form-control" id="email" placeholder="Email">
                <small class="text-danger" *ngIf="form.get('username')?.touched && form.get('username')?.hasError('required')">Username is required</small>
                <small class="text-danger" *ngIf="form.get('username')?.touched && form.get('username')?.hasError('email')">Please key in a valid email</small>
                <small class="text-danger" *ngIf="form.get('username')?.touched && form.get('username')?.hasError('minlength')">Username isn't long enough, minimum of 6 characters</small>
              </div>
<!--              <div class="mb-3">-->
<!--                <label for="password" class="form-label">Password</label>-->
<!--                <input type="password" formControlName="password" class="form-control" id="password" placeholder="Password">-->
<!--                <small class="text-danger" *ngIf="form.get('password')?.touched && form.get('password')?.hasError('required')">Password is required</small>-->
<!--                <small class="text-danger" *ngIf="form.get('password')?.touched && form.get('password')?.hasError('minlength')">Password isn't long enough, minimum of 6 characters</small>-->
<!--              </div>-->

              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group mb-3">
                  <input [type]="inputType" formControlName="password" class="form-control" placeholder="password" id="password" aria-label="password">
                  <div class="input-group-prepend" style="cursor: pointer;" (click)="toggleShowPassword()">
                    <span class="input-group-text" *ngIf="!this.showingPassword"><i class="mdi mdi-eye"></i></span>
                    <span class="input-group-text" *ngIf="this.showingPassword"><i class="mdi mdi-eye-off"></i></span>
                  </div>
                </div>
                <small class="text-danger" *ngIf="form.get('password')?.touched && form.get('password')?.hasError('required')">Password is required</small>
                <small class="text-danger" *ngIf="form.get('password')?.touched && form.get('password')?.hasError('minlength')">Password isn't long enough, minimum of 6 characters</small>
              </div>
              <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input" id="authCheck">
                <label class="form-check-label" for="authCheck">
                  Remember me
                </label>
              </div>
              <div>
                <button type="submit" class="btn btn-primary me-2 mb-2 mb-md-0" (click)="onSubmit($event)">Login</button>
              </div>
              <a routerLink="/auth/forgot-password" class="d-block mt-3 text-muted">Forgot Password? Click here to reset</a>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
