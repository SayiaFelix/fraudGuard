<div class="signup-container">
  <div class="signup-card">
    <!-- Left side with illustration -->
    <div class="signup-left">
      <div class="illustration-wrapper">
        <img src="assets/images/image1.png" alt="Secure Banking Illustration" class="illustration-image">
      </div>
      <h2>Banking Chatbot Platforms</h2>
      <p>Experience next-generation banking with advanced security and AI-powered assistance</p>
    </div>

    <!-- Right side with form -->
    <div class="signup-right">
      <div class="signup-form-container">
        <h3>Welcome</h3>
        <p class="signup-subtitle">Sign in to your account or create a new one</p>
        
        <div class="auth-tabs">
          <button type="button" class="auth-tab">Sign In</button>
          <button type="button" class="auth-tab active">Sign Up</button>
        </div>

        <form class="signup-form" [formGroup]="form" (ngSubmit)="onRegister($event)">
          <div class="form-row">
            <div class="form-group">
              <label for="firstName">First Name</label>
              <input type="text" id="firstName" class="form-control" formControlName="firstName" placeholder="Enter your first name">
            </div>
            <div class="form-group">
              <label for="lastName">Last Name</label>
              <input type="text" id="lastName" class="form-control" formControlName="lastName" placeholder="Enter your last name">
            </div>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" class="form-control" formControlName="email" placeholder="Enter your email">
          </div>
          
          <button type="submit" class="submit-btn" [disabled]="!form.valid || isLoading">
            {{ isLoading ? 'Creating Account...' : 'Create Account' }}
          </button>

          <p class="security-notice">
            Your data is protected with bank-level encryption and security measures
          </p>
        </form>
      </div>
    </div>
  </div>
</div>
