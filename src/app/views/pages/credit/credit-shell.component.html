<header class="cd-topbar">
  <div class="cd-topbar-row">
    <div class="cd-topbar-title">
      <button class="cd-menu" type="button" (click)="toggleSidebar()" aria-label="Open navigation">
        <span></span><span></span><span></span>
      </button>
      <div>
        <h1>AI Credit Intelligence</h1>
      </div>
    </div>

    <div class="cd-date" aria-label="Current date and time">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
      <div>
        <strong>{{ now | date:'EEE, d MMM y' }}</strong>
        <span>{{ now | date:'h:mm a' }}</span>
      </div>
    </div>

    <div class="cd-topbar-end">
      <div class="cd-pop-wrap">
        <button class="cd-bell" type="button" (click)="showNotes = !showNotes; showUser = false" aria-label="Alerts" title="Open the referral queue">
          <svg viewBox="0 0 24 24"><path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5"/><path d="M9 17a3 3 0 0 0 6 0"/></svg>
          <i *ngIf="queue.length"></i>
        </button>
        <div class="cd-pop" *ngIf="showNotes">
          <div class="cd-pop-head">Alerts</div>
          <a *ngFor="let item of queue" [routerLink]="['/alerts']" [queryParams]="{ id: item.id }" (click)="closePopovers()">
            <b>{{ item.name }}</b>
            <span>{{ item.detail }}</span>
          </a>
          <p *ngIf="!queue.length" class="cd-empty">The queue is clear.</p>
        </div>
      </div>

      <div class="cd-pop-wrap">
        <button class="cd-user" type="button" (click)="showUser = !showUser; showNotes = false" title="Account">
          <span class="cd-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="8" r="3.2"/>
              <path d="M5.4 19.2c1-3.1 3.3-4.6 6.6-4.6s5.6 1.5 6.6 4.6"/>
            </svg>
          </span>
          <em>
            <strong>{{ displayName }}</strong>
            <small>{{ title }}</small>
          </em>
          <svg class="cd-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="cd-pop cd-pop-user" *ngIf="showUser">
          <strong>{{ displayName }}</strong>
          <span>{{ email || 'Signed-in officer' }}</span>
          <span>{{ title }}</span>
        </div>
      </div>
    </div>
  </div>
  <div class="cd-navbar-strip" aria-hidden="true"></div>
</header>

<div class="cd-body" [class.cd-body-flush]="ownHeader">
  <header class="cd-page-head" *ngIf="pageTitle">
    <h1>{{ pageTitle }}</h1>
    <p *ngIf="pageSubtitle">{{ pageSubtitle }}</p>
  </header>
  <router-outlet></router-outlet>
</div>
