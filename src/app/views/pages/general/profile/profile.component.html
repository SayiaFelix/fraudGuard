<div class="row profile-body" *ngIf="userData$ | async">
  <!-- left wrapper start -->
  <div class="d-none d-md-block col-md-4 col-xl-3 left-wrapper">
    <div class="card rounded">
      <div class="card-body">
        <div class="d-flex align-items-center justify-content-between mb-2">
          <h6 class="card-title mb-0">Profile Summary</h6>
          <div ngbDropdown>
            <button
              class="btn p-0 no-dropdown-toggle-icon"
              type="button"
              id="dropdownMenuButton"
              ngbDropdownToggle
            >
              <i
                class="feather icon-more-horizontal icon-lg text-muted pb-3px"
              ></i>
            </button>
            <div ngbDropdownMenu aria-labelledby="dropdownMenuButton">
              <a
                ngbDropdownItem
                class="d-flex align-items-center"
                href=""
                (click)="(false)"
                ><i class="feather icon-edit-2 icon-sm me-2"></i>
                <span class="">Edit</span></a
              >
              <a
                ngbDropdownItem
                class="d-flex align-items-center"
                href=""
                (click)="(false)"
                ><i class="feather icon-git-branch icon-sm me-2"></i>
                <span class="">Update</span></a
              >
              <a
                ngbDropdownItem
                class="d-flex align-items-center"
                href=""
                (click)="(false)"
                ><i class="feather icon-eye icon-sm me-2"></i>
                <span class="">View all</span></a
              >
            </div>
          </div>
        </div>

        <div class="mt-3">
          <label class="tx-11 fw-bolder mb-0 text-uppercase">User Type:</label>
          <p class="text-muted">{{ userType }}</p>
        </div>

        <div class="mt-3">
          <label class="tx-11 fw-bolder mb-0 text-uppercase">Joined:</label>
          <p class="text-muted">{{ companyRegistrationDate }}</p>
        </div>
        <div class="mt-3">
          <label class="tx-11 fw-bolder mb-0 text-uppercase">Lives:</label>
          <p class="text-muted">{{ physicalAddress }}</p>
        </div>
        <div class="mt-3">
          <label class="tx-11 fw-bolder mb-0 text-uppercase">Email:</label>
          <p class="text-muted">{{ companyEmail }}</p>
        </div>
        <div class="mt-3">
          <label class="tx-11 fw-bolder mb-0 text-uppercase">KRA Tax PIN:</label>
          <p class="text-muted">{{ taxPin }}</p>
        </div>
        <div class="mt-3">
          <label class="tx-11 fw-bolder mb-0 text-uppercase"
            >Registered Name:</label
          >
          <p class="text-muted">{{ registeredName }}</p>
        </div>
        <div class="mt-3 d-flex social-links">
          <a href="" (click)="(false)" class="btn btn-icon border btn-xs me-2">
            <i class="feather icon-github"></i>
          </a>
          <a href="" (click)="(false)" class="btn btn-icon border btn-xs me-2">
            <i class="feather icon-twitter"></i>
          </a>
          <a href="" (click)="(false)" class="btn btn-icon border btn-xs me-2">
            <i class="feather icon-instagram"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
  <!-- left wrapper end -->
  <!-- middle wrapper start -->
  <div class="col-md-8 col-xl-9 middle-wrapper">
    <div class="row">
      <div class="col-md-12 grid-margin">
        <div class="card rounded">
          <div class="card-header">
            <div class="d-flex align-items-center justify-content-between">
              <div class="d-flex align-items-center">

                <div class="ms-2">
                  <p>Audit Trail</p>
                </div>
              </div>
              <div ngbDropdown>
                <button
                  class="btn p-0 no-dropdown-toggle-icon"
                  type="button"
                  id="dropdownMenuButton2"
                  ngbDropdownToggle
                >
                  <i class="feather icon-more-horizontal icon-lg pb-3px"></i>
                </button>
                <div ngbDropdownMenu aria-labelledby="dropdownMenuButton2">
                  <a
                    ngbDropdownItem
                    class="d-flex align-items-center"
                    href=""
                    (click)="(false)"
                    ><i class="feather icon-meh icon-sm me-2"></i>
                    <span class="">Unfollow</span></a
                  >
                  <a
                    ngbDropdownItem
                    class="d-flex align-items-center"
                    href=""
                    (click)="(false)"
                    ><i class="feather icon-corner-right-up icon-sm me-2"></i>
                    <span class="">Go to post</span></a
                  >
                  <a
                    ngbDropdownItem
                    class="d-flex align-items-center"
                    href=""
                    (click)="(false)"
                    ><i class="feather icon-share-2 icon-sm me-2"></i>
                    <span class="">Share</span></a
                  >
                  <a
                    ngbDropdownItem
                    class="d-flex align-items-center"
                    href=""
                    (click)="(false)"
                    ><i class="feather icon-copy icon-sm me-2"></i>
                    <span class="">Copy link</span></a
                  >
                </div>
              </div>
            </div>
          </div>
          <div class="card-body"  *ngIf="rows.length > 0">
            <app-custom-ngx-table
              [columns]="columns"
              [rows]="rows"

              ></app-custom-ngx-table>
          </div>
          <div class="card-footer">
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- middle wrapper end -->
</div>
