<div class="body w-100" style="position: relative; background-color: #EFEFEF;">
  <div class="d-flex justify-content-between" style="max-width: 100%; max-height: 70px">
    <div class="d-flex justify-content-around" style="margin-left: 40px">
      <div class="p-2">
        <button class="btn btn-md" style="background-color: #6d36a8; color: #f8f8f8; border-radius: 4px">
          <a href="https://www.tra.go.ke/" style="text-decoration: none; text-transform: none" target="_blank"
            class="transition text-light">
            VISIT:WWW.TRA.GO.KE
          </a>
        </button>
      </div>
      <div class="mt-2">
        <img class="img-fluid" src="assets/images/TRA_Logo.png" width="110" height="50" alt="" />
      </div>
    </div>

    <div style="margin-right: 10px">
      <div class="d-flex p-2 justify-content-between">
        <button class="btn btn-md btn-light transition" type="submit">
          <a routerLink="/auth/activate" style="
              text-decoration: none;
              color: #1e0f2e;
              font-family: 'Muli';
              font-style: normal;
              font-weight: 700;
              font-size: 12px;
              letter-spacing: 0.08em;
              border-radius: 8px;
              text-transform: uppercase;
            " class="transition m-1">Sign Up</a>
        </button>
        <button class="btn btn-md login-btn transition" type="submit">
          <a routerLink="/auth/login" style="text-decoration: none" class="transition">
            <span style="
                color: #f8f8f8;
                font-weight: 700;
                letter-spacing: 0.08em;
                font-size: 12px;
              ">SIGN IN</span></a>
        </button>
      </div>
    </div>
  </div>
  <div class="card bg-light">
    <div class="row">
      <div class="card col-md-12 col-lg-12 col-xl-12 col-sm-12"
        style="background-image: url('assets/images/headerl.png');   background-repeat: repeat-x; background-repeat: repeat-y; padding: 40px 60px; color:#F8F8F8">
        <h2 style="font-family: 'Mulish';line-height: 25px;font-weight: 600;font-size: 25px;">
          Ignite Success in Tourism: Align with Our Benchmark Minimum Standards.
        </h2>
      </div>
    </div>
    <div class="card border-0 box-shadow">
      <div class="d-flex justify-content-start mt-4" style="margin-bottom: -20px; padding-left: 40px;">
        <div class="card-title">
          <h3  style="color: #1E0F2E; font-family: 'Mulish';font-weight: 600;font-size: 20px; text-transform: none;">All
            Standards</h3>
        </div>
      </div>
      <a routerLink="/standards/Id">
        <div class="card-body p-2">
          <div class="border-0 box-shadow">
            <div class="grid-margin stretch-card">
              <div class="row" style="padding: 0px 30px">
                <div class="col-md-3 col-lg-3 col-xl-3 col-sm-4 mt-3 pt-2" *ngFor="let std of standards">
                  <div class="" [id]="std.id">
                    <div style="position: relative; display: inline-block;">
                      <div>
                        <img class="img-fluid card-img-top"
                          style="height: 95px; border-top-left-radius: 13px; border-top-right-radius: 13px;"
                          [src]="std.icon" />
                      </div>
                      <div
                        style="position: absolute; width: 60px; height: 60px; margin-left: 4%; margin-top: -11%; border-radius: 50%; background-color: #D0DDF0;"
                        class="card-header d-flex justify-content-center align-items-center border-0 box-shadow">
                      </div>
                    </div>
                    <br><br>
                    <div style="position: relative;">
                      <div class="mt-3">
                        <p style="
                            color: #2268aa;
                            font-family: 'Muli';
                            font-weight: 600;
                            font-size: 16px;
                            line-height: 21px;
                          " class="h2">
                          {{ std.name }}
                        </p>
                        <!-- <p style="color: #2268AA; font-family: 'Muli';font-weight: 600;font-size: 15px;" class="h2"> <a href="" routerLink="/standards/Id">{{std.name}}</a></p> -->
                      </div>
                      <div class="">
                        <p style="
                            color: #1e0f2e;
                            font-family: 'Muli';
                            font-weight: 400;
                            font-size: 12px;
                            line-height: 21px;
                          " class="h3">
                          {{ std.describe }}
                        </p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </a>
    </div>
  </div>
  <div class="card d-flex justify-content-between" style="
      background-color: #d0ddf0;
      padding: 25px 96px;
    ">
    <div>
      <img class="img-fluid" style="position: absolute; margin-top: 4px" src="assets/images/TRA_Logo.png" width="115"
        height="60" alt="logo" />
    </div>
    <div style="
        font-family: 'Mulish';
        font-style: normal;
        text-transform: uppercase;
        font-weight: 700;
        font-size: 15px;
        line-height: 25px;
        text-align: center;
        letter-spacing: 0.08em;
        margin-left: 50%;
      ">
      <a routerLink="/" style="text-decoration: none; color: #1e0f2e" class="transition">Home</a>
      <a routerLink="/" class="" style="text-decoration: none; margin: 20px; color: #1e0f2e" class="transition">Tourism
        ACT 2011</a>
      <a routerLink="/" style="text-decoration: none; color: #1e0f2e" class="transition">Tourism Regulations 2014</a>
      <div class="d-flex justify-content-end">
        <div
          style="position:absolute; border-radius: 50%; bottom:45px; right:38px; width:60px; height: 60px;background-color: #2766BF;"
          class="card-header d-flex align-items-center border-0">
          <!-- <img   (click)='openModal(leaveComment)' class="img-fluid"  style="height: 25px ;" src="assets/images/chat.png" alt="logo" /> -->
          <p style="color: #F8F8F8; font-size: 30px; margin-left: -13px;
          "> <i (click)='openModal(leaveComment)' class="mt-2 fa-solid fa-comments" title="Leave A Comment"></i></p>
    
        </div>
      </div>
    </div>
  </div>
</div>
<ng-template #leaveComment>
  <div class="">
    <div class="row">
      <div class="col-12">
        <div class="">
          <div class="card-header d-flex justify-content-between" style="background-color: #d0ddf0; font-family: 'Mulish'; font-weight: 900; border-radius:4px;">
            <h4 class="text-start p-2 mt-2" style="color: #6D36A8; font-size: 23px;">Talk to Customer Care</h4>
            <div style="color: #6D36A8;">
              <button type="button "  class="mt-3 p-2 btn-close"  (click)="closeModal()" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
          </div>
          <article class="">
            <p *ngIf="errorMessage" class="text-danger">{{errorMessage}}</p>
            <form class="mt-1" [formGroup]="form" (ngSubmit)="onleaveComment()" class="row px-3">
              <div class="tab-content col-12 border-0">
                <div class="form-group mt-2">
                  <input formControlName="name" type="text" class="form-control validation-field border-0" id="name"
                    placeholder="Your Name or Company*">
                  <!-- <small class="text-danger" *ngIf="f.concern.touched && f.concern.errors?.required">Field Required</small> -->
                </div>
                <div class="form-group mt-2">
                  <input formControlName="email" type="email" class="form-control validation-field border-0" id="email"
                    placeholder="Your email address*">
                  <!-- <small class="text-danger" *ngIf="f.concern.touched && f.concern.errors?.required">Field Required</small> -->
                </div>
                <div class="form-group mt-2">
                  <input type="text" name="tel" formControlName="phoneNumber" id="phoneNumber"
                    placeholder="Phone Number*" class="form-control validation-field border-0" ng2TelInput
                    data-initial-country="ke">
                  <!-- <input formControlName="phoneNumber" id="phoneNumber" type="text"  placeholder="Phone Number*" class="form-control validation-field border-0"
                    id="purpose" placeholder="Your Phone No,"> -->
                  <!-- <small class="text-danger" *ngIf="f.concern.touched && f.concern.errors?.required">Field Required</small> -->
                </div>
                <div class="form-group mt-2">
                  <input formControlName="subject" type="text" class="form-control validation-field border-0" id="subject"
                    placeholder="Subject">
                  <!-- <small class="text-danger" *ngIf="f.concern.touched && f.concern.errors?.required">Field Required</small> -->
                </div>
                <div class="form-group mt-2">
                  <textarea formControlName="message"  type="text" id="message" cols="15" rows="3"  placeholder="Message" class="form-control validation-field border-0"></textarea>
                  <!-- <small class="text-danger" *ngIf="f.concern.touched && f.concern.errors?.required">Field Required</small> -->
                </div>
                <div class="col-12 bg-white text-center py-1 mt-3 mb-2">
                  <button style="width: 100%; border: none;"
                    class="btn btn-block bronchure-btn transition" type="submit">
                    <span style="color: white;">SEND</span>
                  </button>
                </div>
              </div>
            </form>
          </article>
        </div>
      </div>
    </div>
  </div>
</ng-template>
