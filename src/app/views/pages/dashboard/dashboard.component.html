<div style="margin-top:-60px; min-height:600px;"  
     class="container py-4 d-flex flex-column align-items-center"> 
  <div class="row justify-content-center flex-grow-1 w-100">
    <div class="p-4 text-center col-lg-8 col-md-10 d-flex flex-column">

      <div *ngIf="chatStarted"  
     class="card shadow-sm mb-3 flex-grow-1 border-0" 
     style="overflow-y: auto;" 
     #chatContainer>

  <div class="card-body d-flex flex-column">

    <!-- Date Divider -->
    <div class="d-flex align-items-center my-3 text-muted small">
      <div class="flex-grow-1 border-top"></div>
      <span class="px-3">{{ currentDate }}</span>
      <div class="flex-grow-1 border-top"></div>
    </div>

    <!-- Conversation Messages -->
    <div class="mt-2">
      <div *ngFor="let msg of conversation" 
           class="mb-3 d-flex flex-column"
           [ngClass]="{'align-items-end': msg.sender === 'user', 'align-items-start': msg.sender === 'bot'}">


        <div class="d-flex align-items-center p-2 rounded-3 shadow-sm"
             [ngClass]="msg.sender === 'user' ? 'user-bubble' : 'bot-bubble'"
             style="max-width: 75%;">

          <i *ngIf="msg.sender === 'bot'" class="fas fa-robot me-2 text-secondary"></i>
          <i *ngIf="msg.sender === 'user'" class="fas fa-user me-2 text-primary"></i>
          <span [innerHTML]="msg.formattedText || msg.text"></span>
        </div>
        <div class="small text-muted mt-1">
          {{ msg.time }}
        </div>
      </div>
    </div>

    <!-- Typing Indicator -->
    <div *ngIf="isTyping" class="d-flex align-items-start mb-3">
      <div class="bot-bubble d-flex align-items-center" style="max-width: 50%;">
        <i class="fas fa-robot me-2"></i>
        <span class="typing-dots">
          <span>.</span><span>.</span><span>.</span>
        </span>
      </div>
    </div>

  </div>

    <div class="shadow-sm input-group mt-2">
              <input type="text" [(ngModel)]="userQuery"
                    class="form-control"
                    placeholder="Type something..." 
                    (keyup.enter)="sendMessage()">

              <button class="btn btn-outline-dark" for="fileUpload" type="button">
                   <i class="fas fa-paperclip"></i>
              </button>
              <input type="file" id="fileUpload" hidden (change)="onFileSelected($event)" />

              <button class="btn btn-outline-success" type="button" (click)="sendMessage()">
                <i class="fas fa-paper-plane"></i>
              </button>
    </div>

      </div>

       <div *ngIf="!chatStarted" class="flex-grow-1 d-flex flex-column justify-content-center align-items-center">
           <div class="mb-4">
        <h2 class="fw-bold mb-3">Hello, {{ getCapitalizedName() }}</h2>
        <div class="d-flex flex-wrap justify-content-center gap-2">
          <button class="quick-btn btn" (click)="startChat('How do I test an AI agent?')">
            <i class="fas fa-robot"></i> How do I test an AI agent?
          </button>
          <button class="quick-btn btn" (click)="startChat('What is a teamspace?')">
            <i class="fas fa-briefcase"></i> What is a teamspace?
          </button>
          <button class="quick-btn btn" (click)="startChat('How do I add custom fields?')">
            <i class="fas fa-cogs"></i> How do I add custom fields?
          </button>
          <button class="quick-btn btn" (click)="startChat('Can I ban customers?')">
            <i class="fas fa-ban"></i> Can I ban customers?
          </button>
          <button class="quick-btn btn" (click)="startChat('How do I add team members?')">
            <i class="fas fa-user-plus"></i> How do I add team members?
          </button>
        </div>
           </div>

            <div class="shadow-sm input-group mt-2">
              <input type="text" [(ngModel)]="userQuery"
                    class="form-control"
                    placeholder="Ask how to use ECL AICX..."
                    (keyup.enter)="sendMessage()">
              <button class="btn btn-outline-secondary" type="button" (click)="sendMessage()">
                <i class="fas fa-paper-plane"></i>
              </button>
            </div>

       </div>
   

    </div>
  </div>
</div>

<hr class="my-4">
<div class="text-center mb-3 small text-muted">
  <a href="#" class="mx-2 text-decoration-none text-muted">APIs</a> |
  <a href="#" class="mx-2 text-decoration-none text-muted">Documentation</a> |
  <a href="#" class="mx-2 text-decoration-none text-muted">Pricing</a> |
  <a href="#" class="mx-2 text-decoration-none text-muted">Enterprise</a> |
  <a href="#" class="mx-2 text-decoration-none text-muted">Terms of Use</a>
</div>
