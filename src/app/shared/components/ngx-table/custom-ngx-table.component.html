<div class="table-responsive table-striped table-bordered">
  <ngx-datatable #table [columnMode]="ColumnMode.force" [columns]="columns" [footerHeight]="50" [limit]="2"
                 [loadingIndicator]="loadingIndicator" [rowHeight]="'auto'" [rows]="rows"
                 class="bootstrap table-bordered table-striped striped">
    <!-- Row Detail Template -->
    <ngx-datatable-row-detail #myDetailRow (toggle)="onDetailToggle($event)" [rowHeight]="100">
      <ng-template let-expanded="expanded" let-row="row" ngx-datatable-row-detail-template>
        <div style="padding-left: 35px">
          <div><strong>Address</strong></div>
          <div>Child Details</div>
        </div>
      </ng-template>
    </ngx-datatable-row-detail>

    <!-- Column Templates -->
    <ngx-datatable-column [canAutoResize]="false" [draggable]="false" [resizeable]="false" [sortable]="false"
                          [width]="5">
      <ng-template let-expanded="expanded" let-row="row" let-value="value" ngx-datatable-cell-template>
        <a (click)="toggleExpandRow(row)" [class.datatable-icon-down]="expanded"
           [class.datatable-icon-right]="!expanded" href="javascript:void(0)" title="Expand/Collapse Row">
        </a>
      </ng-template>
    </ngx-datatable-column>

    <ng-container *ngFor="let column of columns">
      <ngx-datatable-column *ngIf="column.name === 'ID'" [maxWidth]="40" [minWidth]="35" name="ID" prop="id">
      </ngx-datatable-column>

      <ngx-datatable-column
        *ngIf="column.name === 'Actions'"
        [maxWidth]="150"
        [minWidth]="150"
        [sortable]="false"
        class="parent-item"
        name="Actions" prop="actions"
      >
        <ng-template
          class="parent-item"
          let-row="row"
          let-value="value"
          ngx-datatable-cell-template
        >
                  <span class="parent-item">
                    <ng-template #buttons>
                      <ul class="list-group list-group-flush">
                        <li (click)="sendEvent(row, action)"
                            *ngFor="let action of actions; index as i"
                            class="action-buttons list-group-item pt-1 pb-1 text-center">
                          {{action}}
                        </li>
                      </ul>
                    </ng-template>
                    <div class="example">
                      <button [ngbPopover]="buttons" class="btn btn-primary btn-sm" placement="bottom" type="button">
                        <i class="feather icon-chevron-down"></i> Actions
                      </button>
                    </div>
                  </span>
        </ng-template>
      </ngx-datatable-column>

      <ngx-datatable-column
        *ngIf="column.name === 'Status' || column.name === 'Active'"
        [maxWidth]="150"
        [minWidth]="150"
        name="Status" prop="status">
        <ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
          <app-label-active [value]="row.status || row.active"></app-label-active>
        </ng-template>
      </ngx-datatable-column>

      <ngx-datatable-column *ngIf="column.name === 'CreatedOn'"
                            [maxWidth]="150"
                            [minWidth]="150"
                            name="CreatedOn" prop="createdOn">
      </ngx-datatable-column>

      <ngx-datatable-column
        *ngIf="column.name !== 'Actions' && column.name !== 'Status' && column.name !== 'ID' && column.name !== 'CreatedOn'"
        name="{{ column.name }}" prop="{{ column.prop }}">
      </ngx-datatable-column>
    </ng-container>
  </ngx-datatable>
</div>
