server {
    listen 80;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to your backend (adjust if needed)
    location /api {
        proxy_pass http://backend:5015;
        proxy_set_header Host $host;
    }
}