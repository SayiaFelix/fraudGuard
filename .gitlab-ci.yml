workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'developer' || $CI_COMMIT_BRANCH == 'cicd-testing' || $CI_COMMIT_BRANCH == 'developer'
      when: always

stages:
  - preBuild
  - build
  - deploy

buildBaseImage:
  stage: preBuild
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - /kaniko/executor
      --context "$PWD"
      --dockerfile "builder.Dockerfile"
      --destination "devops-registry.ekenya.co.ke/tra-project/customer-portal-builder:latest"
  only:
    changes:
      - package.json

buildImage:
  stage: build
  image: 
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - /kaniko/executor
      --context "$PWD"
      --dockerfile "Dockerfile"
      --destination "devops-registry.ekenya.co.ke/tra-project/customer-portal:latest"
