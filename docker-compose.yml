version: "3.8"

services:
  backend:
    build: ./backend
    container_name: ams_backend
    volumes:
      - ./backend/db.json:/app/db.json  # persist JSON data
    ports:
      - "3000:3000"
    restart: always

  frontend:
    build: ./frontend
    container_name: ams_frontend
    ports:
      - "5035:5035"
    depends_on:
      - backend
    restart: always
